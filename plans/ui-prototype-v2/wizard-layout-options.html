<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动向导整体布局 · 设计方案对比</title>
<style>
  :root {
    --bg: #f4f5f7; --bg-panel: #fafbfc; --bg-card: #ffffff; --bg-inset: #f1f3f6;
    --border: #e2e5ea;
    --text: #212832; --text-dim: #5a6372; --text-faint: #9aa2ae;
    --blue: #2f6fe0; --green: #1f9d6b; --orange: #d97b1c; --red: #d63c3c; --purple: #8a55c9; --cyan: #158a8a;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.55; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 24px 80px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 18px; }
  .switch { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .switch button { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-dim); padding: 7px 16px; }
  .switch button.active { color: var(--blue); border-color: var(--blue); background: color-mix(in srgb, var(--blue) 8%, #fff); font-weight: 600; }
  .opt-note { font-size: 12px; color: var(--text-dim); background: #fff; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; line-height: 1.7; }
  .opt-note b { color: var(--text); }

  /* 共用元件 */
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 18px 60px rgba(20,30,50,.14); overflow: hidden; }
  .modal-head { display: flex; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; }
  .modal-head .x { margin-left: auto; color: var(--text-faint); }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--bg-panel); }
  .btn { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-dim); padding: 6px 14px; }
  .btn.accent { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, transparent); background: color-mix(in srgb, var(--blue) 9%, #fff); font-weight: 600; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .btn.sm { padding: 3px 10px; font-size: 11.5px; }
  .chip { display: inline-block; font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; background: var(--bg-card); white-space: nowrap; }
  .chip.kind { font-family: var(--mono); font-size: 10.5px; color: var(--purple); border-color: color-mix(in srgb, var(--purple) 35%, transparent); background: color-mix(in srgb, var(--purple) 9%, transparent); }
  .chip.model { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 35%, transparent); background: color-mix(in srgb, var(--cyan) 9%, transparent); }
  .f-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
  .f-label .req { color: var(--red); }
  .f-row { margin-bottom: 14px; }
  .f-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; padding: 6px 16px; border: none; background: var(--bg-card); color: var(--text-dim); cursor: pointer; }
  .seg button.active { background: var(--blue); color: #fff; font-weight: 600; }
  select.inp, input.inp { font: inherit; font-size: 12.5px; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--bg-card); outline: none; }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick .opt { font-size: 12px; cursor: pointer; user-select: none; border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; color: var(--text-dim); background: var(--bg-card); font-family: var(--mono); }
  .pick .opt.on { color: var(--text); border-color: var(--blue); background: color-mix(in srgb, var(--blue) 13%, transparent); }
  .idlink { font-family: var(--mono); font-size: 11px; color: var(--blue); text-decoration: none; border-bottom: 1px dashed color-mix(in srgb, var(--blue) 45%, transparent); white-space: nowrap; }
  .idlink.rep { color: var(--purple); border-bottom-color: color-mix(in srgb, var(--purple) 45%, transparent); }
  .type-chip { display: inline-block; font-size: 10.5px; line-height: 1.6; border-radius: 999px; padding: 0 8px; border: 1px solid; white-space: nowrap; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .pager .info { font-size: 11.5px; color: var(--text-dim); }
  .pager .info b { font-family: var(--mono); }
  .pager .btn { padding: 3px 12px; font-size: 11.5px; }

  /* 方案 A 结果框（沿用上一轮） */
  .a-summary { border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); background: color-mix(in srgb, var(--blue) 5%, #fff); border-radius: 10px; padding: 12px 14px; }
  .a-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  .a-stats .st b { font-family: var(--mono); font-weight: 650; font-size: 14px; margin-right: 3px; }
  .a-stats .st span { color: var(--text-faint); font-size: 11px; }
  .a-stats .st.accent b { color: var(--blue); }
  .typebar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 2px 0 6px; }
  .typebar span { display: block; height: 100%; }
  .a-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
  .a-legend .dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  .a-table { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data th { text-align: left; font-size: 11px; color: var(--text-faint); font-weight: 600; background: var(--bg-panel); padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.data td { padding: 7px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  table.data tr:last-child td { border-bottom: none; }
  table.data tbody tr:hover { background: color-mix(in srgb, var(--blue) 4%, #fff); }
  table.data td.ph { color: var(--text-dim); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ═══ 布局 1：左右两栏 ═══ */
  .l1-body { display: grid; grid-template-columns: 270px 1fr; min-height: 480px; }
  .l1-side { border-right: 1px solid var(--border); background: var(--bg-panel); padding: 16px 16px 20px; }
  .l1-side .f-label { margin-top: 2px; }
  .l1-side-hint { font-size: 11px; color: var(--text-faint); margin-top: 14px; line-height: 1.6; }
  .l1-main { padding: 16px 18px; min-width: 0; }
  .l1-main-h { font-size: 12px; font-weight: 650; color: var(--text-dim); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

  /* ═══ 布局 2：分步向导 ═══ */
  .l2-steps { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--text-faint); padding: 12px 18px 0; }
  .l2-steps .on { color: var(--blue); font-weight: 600; }
  .l2-body { padding: 16px 18px; }
  .l2-condstrip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--border); background: var(--bg-panel); border-radius: 8px; padding: 7px 12px; margin-bottom: 12px; font-size: 12px; }
  .l2-condstrip .edit { margin-left: auto; }

  /* ═══ 布局 3：条件折叠 + 结果为主 ═══ */
  .l3-body { padding: 16px 18px; }
  .l3-cond { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .l3-cond-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 14px; cursor: pointer; user-select: none; background: var(--bg-panel); }
  .l3-cond-head:hover { background: var(--bg-inset); }
  .l3-cond-head .t { font-size: 12px; font-weight: 650; color: var(--text-dim); margin-right: 4px; }
  .l3-cond-head .caret { margin-left: auto; color: var(--text-faint); font-size: 11px; transition: transform .15s; }
  .l3-cond.open .l3-cond-head .caret { transform: rotate(90deg); }
  .l3-cond-body { display: none; border-top: 1px solid var(--border); padding: 14px; background: #fff; }
  .l3-cond.open .l3-cond-body { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>启动向导整体布局 · 设计方案</h1>
  <p class="sub">结果区统一用上一轮选定的「方案 A」样式；这里对比的是<b>筛选条件与查询结果在浮窗里的整体组织方式</b>。三个布局都可交互。</p>
  <div class="switch">
    <button data-opt="l1" class="active">布局 1 · 左右两栏</button>
    <button data-opt="l2">布局 2 · 分步向导</button>
    <button data-opt="l3">布局 3 · 条件折叠</button>
  </div>
  <div class="opt-note" id="optNote"></div>
  <div id="host"></div>
</div>

<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TYPE_COLOR = { '非问题': '#9aa2ae', '是问题-错误': '#d63c3c', '是问题-prompt缺失某些提示词': '#d97b1c', '是问题-模型问题': '#8a55c9', '未分析': '#c4cbd6' };
const tchip = t => `<span class="type-chip" style="color:${TYPE_COLOR[t]};border-color:color-mix(in srgb, ${TYPE_COLOR[t]} 45%, transparent);background:color-mix(in srgb, ${TYPE_COLOR[t]} 9%, #fff)">${t}</span>`;
const ROWS = [
  { rid: 'R-CB81-02', iid: 'I-CB81-02', ph: '反序列化检索结果时假定 items 字段一定存在，实际返回体缺少该字段，导致该次检索返回 0 条结果', model: 'glm-5.3', type: '是问题-错误', real: true },
  { rid: 'R-CB81-03', iid: 'I-CB81-03', ph: '模型在规划阶段连续扩大检索范围，未复用已抓取结果；预期 ≤30min，实际执行 2h 12m，超出 4.4 倍', model: 'glm-5.3', type: '是问题-模型问题', real: true },
  { rid: 'R-2F5E-01', iid: 'I-2F5E-01', ph: 'prompt 未要求读取快照前校验 turns 字段，subagent 直接读取导致越界，该步结果被丢弃', model: 'glm-5.3-flash', type: '是问题-prompt缺失某些提示词', real: true },
  { rid: 'R-2F5E-02', iid: 'I-2F5E-02', ph: '模型在规划阶段连续扩大检索范围，未复用已抓取结果；预期 ≤30min，实际执行 2h 12m', model: 'glm-5.3-flash', type: '是问题-模型问题', real: true },
  { rid: 'R-050B-03', iid: 'I-050B-03', ph: '读取 data/index.json 时未处理 ENOENT，错误被上层 catch 静默吞掉，导致 5 条结论引用空索引', model: 'glm-5.3', type: '是问题-错误', real: true },
  { rid: 'R-050B-04', iid: 'I-050B-04', ph: '模型在规划阶段连续扩大检索范围，未复用已抓取结果；预期 ≤30min，实际执行 2h 12m', model: 'glm-5.3', type: '是问题-模型问题', real: true },
  { rid: 'R-3F8E-01', iid: 'I-3F8E-01', ph: '插件清单不是合法 JSON，解析时抛出 SyntaxError，后续插件事件缺失', model: 'glm-5.3', type: '是问题-错误', real: true },
  { rid: 'R-1647', iid: null, ph: '报告导出结构损坏', model: 'kimi-k2', type: '是问题-模型问题' },
  { rid: 'R-1681', iid: null, ph: '重复加载同一文档', model: 'gpt-5', type: '是问题-错误' },
  { rid: 'R-1715', iid: null, ph: '分析范围越界', model: 'glm-5.3-flash', type: '是问题-模型问题' },
  { rid: 'R-1749', iid: null, ph: '输出缺少来源引用', model: 'kimi-k2', type: '是问题-错误' },
  { rid: 'R-1817', iid: null, ph: '输出缺少来源引用', model: 'glm-5.3-flash', type: '是问题-prompt缺失某些提示词' },
];
const TOTAL = ROWS.length, USED = ROWS.filter(r => r.type.startsWith('是问题')).length;
const idCell = r => r.real ? `<a class="idlink rep" href="#">${r.rid}</a>` : `<span style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">${r.rid}</span>`;
const iidCell = r => r.real ? `<a class="idlink" href="#">${r.iid}</a>` : `<span style="color:var(--text-faint)">—</span>`;

function resultBoxA(page, narrow){
  const byType = {};
  ROWS.forEach(r => byType[r.type] = (byType[r.type] || 0) + 1);
  const entries = Object.entries(byType);
  const bar = entries.map(([t, n]) => `<span style="width:${(n / TOTAL * 100).toFixed(1)}%;background:${TYPE_COLOR[t]}"></span>`).join('');
  const legend = entries.map(([t, n]) => `<span><span class="dot" style="background:${TYPE_COLOR[t]};width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px"></span>${t} <b style="font-family:var(--mono)">${n}</b></span>`).join('');
  const pages = Math.ceil(TOTAL / 8);
  const from = (page - 1) * 8 + 1, to = Math.min(TOTAL, page * 8);
  const rows = ROWS.slice((page - 1) * 8, page * 8).map(r => `<tr>
    <td>${idCell(r)}</td><td>${iidCell(r)}</td><td class="ph" title="${esc(r.ph)}">${esc(r.ph)}</td>
    <td style="font-family:var(--mono);font-size:11px;color:var(--cyan)">${r.model}</td><td>${tchip(r.type)}</td>
  </tr>`).join('');
  return `<div class="a-summary">
    <div class="a-stats">
      <span class="st"><b>51</b><span>命中 session</span></span>
      <span class="st"><b>${TOTAL}</b><span>问题报告</span></span>
      <span class="st"><b>15</b><span>已分析</span></span>
      <span class="st"><b>3</b><span>未分析</span></span>
      <span class="st accent"><b>${USED}</b><span>「是问题」进入聚类</span></span>
    </div>
    <div class="typebar">${bar}</div>
    <div class="a-legend">${legend}</div>
    <div class="a-table"><table class="data"><thead><tr><th>报告 ID</th><th>来源问题 ID</th><th>问题现象</th><th>模型</th><th>归因</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="pager">
      <button class="btn" data-pg="-1" ${page <= 1 ? 'disabled' : ''}>← 上一页</button>
      <span class="info">第 <b>${page}</b> / ${pages} 页 · 共 <b>${TOTAL}</b> 份 · 当前第 ${from}–${to} 份</span>
      <button class="btn" data-pg="1" ${page >= pages ? 'disabled' : ''}>下一页 →</button>
    </div>
  </div>`;
}

function condForm(vertical){
  return `
    <div class="f-row"><div class="f-label">进化对象 <span class="req">*</span></div>
      <div class="f-inline" ${vertical ? 'style="flex-direction:column;align-items:flex-start;gap:8px"' : ''}>
        <div class="seg"><button class="active">skill</button><button>agent</button></div>
        <select class="inp"><option>deep-research</option></select>
        ${vertical ? '' : '<span style="color:var(--text-faint);font-size:12px">版本</span>'}
        <select class="inp"><option>v2.0.0</option></select>
      </div>
    </div>
    <div class="f-row"><div class="f-label">时间段（session 启动时间） <span class="req">*</span></div>
      <div class="f-inline"><input class="inp" type="date" value="2026-08-20"> <span style="color:var(--text-faint)">~</span> <input class="inp" type="date" value="2026-09-10"></div>
    </div>
    <div class="f-row" style="margin-bottom:0"><div class="f-label">模型（多选）</div>
      <div class="pick"><span class="opt on">glm-5.3</span><span class="opt on">glm-5.3-flash</span><span class="opt on">claude-sonnet-4.5</span><span class="opt">gpt-5</span><span class="opt">deepseek-v3.2</span><span class="opt">kimi-k2</span></div>
    </div>`;
}
function condChips(){
  return `<span class="chip kind">skill:deep-research@v2.0.0</span><span class="chip">2026-08-20 ~ 2026-09-10</span><span class="chip model">glm-5.3</span><span class="chip model">glm-5.3-flash</span><span class="chip model">claude-sonnet-4.5</span>`;
}
const FOOT = `<button class="btn accent" data-act="query">⟳ 查询匹配报告</button><button class="btn">仅聚类分析</button><button class="btn primary">启动自进化 →</button>`;

/* ── 布局 1：左右两栏 ── */
let l1Page = 1, l1Queried = true;
function renderL1(){
  return `<div class="modal">
    <div class="modal-head">启动自进化 <span class="x">✕</span></div>
    <div class="l1-body">
      <aside class="l1-side">
        ${condForm(true)}
        <div class="l1-side-hint">改条件后点底部「查询匹配报告」刷新右侧结果。<br><span style="color:var(--blue);cursor:pointer" data-act="toggleq">${l1Queried ? '模拟：改为未查询状态' : '模拟：执行查询'}</span></div>
      </aside>
      <main class="l1-main">
        <div class="l1-main-h">查询结果</div>
        ${l1Queried ? resultBoxA(l1Page) : '<div style="border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px">设置左侧条件后，点底部「⟳ 查询匹配报告」查看命中结果</div>'}
      </main>
    </div>
    <div class="modal-foot">${FOOT}</div>
  </div>`;
}

/* ── 布局 2：分步向导 ── */
let l2Step = 1, l2Page = 1;
function renderL2(){
  const body = l2Step === 1
    ? `<div class="l2-body">${condForm(false)}
       <div style="font-size:11.5px;color:var(--text-faint)">确认条件后点「下一步」执行查询并核对命中的问题报告。</div></div>`
    : `<div class="l2-body">
       <div class="l2-condstrip">${condChips()}<button class="btn sm edit" data-act="back">← 修改条件</button></div>
       ${resultBoxA(l2Page)}</div>`;
  const foot = l2Step === 1
    ? `<button class="btn primary" data-act="next">下一步：查询匹配报告 →</button>`
    : `<button class="btn" data-act="back">← 上一步</button><button class="btn">仅聚类分析</button><button class="btn primary">启动自进化 →</button>`;
  return `<div class="modal">
    <div class="modal-head">启动自进化 <span class="x">✕</span></div>
    <div class="l2-steps"><span class="${l2Step === 1 ? 'on' : ''}">① 设置筛选条件</span> → <span class="${l2Step === 2 ? 'on' : ''}">② 确认查询结果并启动</span></div>
    ${body}
    <div class="modal-foot">${foot}</div>
  </div>`;
}

/* ── 布局 3：条件折叠 + 结果为主 ── */
let l3Open = false, l3Page = 1, l3Queried = true;
function renderL3(){
  return `<div class="modal">
    <div class="modal-head">启动自进化 <span class="x">✕</span></div>
    <div class="l3-body">
      <div class="l3-cond ${l3Open ? 'open' : ''}">
        <div class="l3-cond-head" data-act="fold"><span class="t">筛选条件</span>${condChips()}<span class="caret">▶</span></div>
        <div class="l3-cond-body">${condForm(false)}</div>
      </div>
      ${l3Queried ? resultBoxA(l3Page) : '<div style="border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px">展开上方条件并点「⟳ 查询匹配报告」查看命中结果 <span style="color:var(--blue);cursor:pointer" data-act="toggleq">模拟查询</span></div>'}
    </div>
    <div class="modal-foot">${FOOT}</div>
  </div>`;
}

const NOTES = {
  l1: '<b>布局 1 · 左右两栏</b>：条件固定在左栏（电商/搜索页经典的 facet rail），结果独占右侧主区，弹窗加宽。改条件时结果始终在视野内，对照感最强；缺点是弹窗更宽，条件少时左栏略空。',
  l2: '<b>布局 2 · 分步向导</b>：①设条件 →「下一步」→ ②结果确认页（条件折叠成顶部摘要条，可返回修改）。职责最清晰、弹窗不用变宽，结果区高度充裕；缺点是多一次点击，改条件要回上一步。',
  l3: '<b>布局 3 · 条件折叠</b>：单栏不变宽，查询后条件自动折叠成一行摘要条，点开即改、改完查询再收起。结果区仍是页面主角，宽度不变；缺点是条件与结果仍同处一屏（只是收起了）。',
};
const host = document.getElementById('host');
const note = document.getElementById('optNote');
let cur = 'l1';
function render(){
  host.innerHTML = cur === 'l1' ? renderL1() : cur === 'l2' ? renderL2() : renderL3();
  note.innerHTML = NOTES[cur];
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => {
  cur = b.dataset.opt;
  document.querySelectorAll('.switch button').forEach(x => x.classList.toggle('active', x === b));
  render();
});
host.addEventListener('click', e => {
  const el = e.target.closest('[data-act], [data-pg]');
  if (!el) { if (e.target.closest('a.idlink')) e.preventDefault(); return; }
  const act = el.dataset.act;
  if (el.dataset.pg) { const d = +el.dataset.pg; if (cur === 'l1') l1Page += d; else if (cur === 'l2') l2Page += d; else l3Page += d; }
  else if (act === 'toggleq') { if (cur === 'l1') l1Queried = !l1Queried; else l3Queried = !l3Queried; }
  else if (act === 'query') { if (cur === 'l1') { l1Queried = true; l1Page = 1; } else { l3Queried = true; l3Page = 1; l3Open = false; } }
  else if (act === 'next') l2Step = 2;
  else if (act === 'back') l2Step = 1;
  else if (act === 'fold') l3Open = !l3Open;
  render();
});
render();
</script>
</body>
</html>
