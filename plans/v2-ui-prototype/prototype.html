<section id="loginView" class="login-page hidden" data-testid="login-page">
  <div class="login-brand"><div class="brand"><span class="brand-mark">H</span> Harness Evolution</div><div><span class="tag blue">V2 · Workspace</span><h1>让每一个问题，都有清晰的进化路径。</h1><p>在多工作空间中诊断 Agent 轨迹，从 bad case 发现、对象归因到自进化运行，保留完整证据链。</p></div><small>轨迹诊断与自进化平台</small></div>
  <div class="login-form-wrap"><form class="login-form" id="loginForm"><h2>欢迎回来</h2><p class="muted">登录后进入你有权限的工作空间</p><div class="field"><label for="account">账号</label><input id="account" value="admin@harness.dev" autocomplete="username"></div><div class="field"><label for="password">密码</label><input id="password" type="password" value="prototype-only" autocomplete="current-password"></div><button class="btn primary" type="submit">登录</button><p class="login-foot">账号由管理员开通 · 不开放注册<br>支持 Cookie 会话恢复与后续身份提供方接入</p></form></div>
</section>

<script>
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const icons={search:'<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',chevron:'<svg class="icon" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'};
const objects=['deep-research','workflow','browser-agent','code-reviewer'];
const cases=[
['BC-240918-001','检索结果反序列化失败','deep-research','self','2026-11-09 14:32','cb819c5b-286f-4eab-a681-4ba5414b844d',4],
['BC-240918-002','重复加载技能说明','deep-research','self','2026-11-09 13:18','cb819c5b-286f-4eab-a681-4ba5414b844d',3],
['BC-240918-003','浏览器等待条件提前结束','browser-agent','discovery','2026-11-09 11:06','a749e530-835a-4f56-a6f0-9a827ce22ad1',2],
['BC-240918-004','子任务结果未传递主会话','workflow','discovery','2026-11-08 18:44','d31ea52b-13db-41d9-83bb-c31d47ba210a',5],
['BC-240918-005','评审意见缺少文件定位','code-reviewer','self','2026-11-08 16:20','f17b88f1-33cb-476f-9f22-cbb611a04d52',1],
['BC-240918-006','检索来源校验缺失','deep-research','discovery','2026-11-08 10:12','cb819c5b-286f-4eab-a681-4ba5414b844d',2],
['BC-240918-007','页面截图尺寸不一致','browser-agent','self','2026-11-07 17:09','a749e530-835a-4f56-a6f0-9a827ce22ad1',0],
['BC-240918-008','并行任务取消状态错误','workflow','self','2026-11-07 14:51','d31ea52b-13db-41d9-83bb-c31d47ba210a',3],
['BC-240918-009','误报安全策略命中','code-reviewer','discovery','2026-11-06 19:27','f17b88f1-33cb-476f-9f22-cbb611a04d52',1],
['BC-240918-010','上下文压缩后引用丢失','deep-research','discovery','2026-11-06 15:03','cb819c5b-286f-4eab-a681-4ba5414b844d',2],
['BC-240918-011','工具重试次数超过限制','workflow','discovery','2026-11-05 12:41','d31ea52b-13db-41d9-83bb-c31d47ba210a',1],
['BC-240918-012','空 diff 被标记为已修复','code-reviewer','self','2026-11-05 09:26','f17b88f1-33cb-476f-9f22-cbb611a04d52',2]
].map((x,i)=>({id:x[0],title:x[1],object:x[2],type:x[3],time:x[4],session:x[5],attributions:x[6],index:i}));
const sessionTitles=['AI agent 视频播放结合的开源产品调研','修复跨页面检索状态丢失','为报告生成补充来源校验','梳理浏览器工具超时问题','代码审查结果结构优化','重构并行子任务调度','排查技能重复加载','升级工作流取消语义','补充检索错误回归测试','分析空补丁评测误判'];
const sessions=sessionTitles.map((title,i)=>({id:i===0?'cb819c5b-286f-4eab-a681-4ba5414b844d':`session-v2-${String(i+1).padStart(3,'0')}-latest`,title,time:`11-0${i<3?9:i<6?8:7} ${17-i}:2${i}`,repo:i%2?'harness-lab':'llm-wiki',cases:i%4+1,turns:23+i*3}));
const state={view:'overview',workspace:'AI Agent 研发',role:'global',selectedObjects:new Set(),grain:'日',type:'all',page:1,pageSize:5,selectedSession:sessions[0].id,sessionSearch:'',sessionResults:sessions.slice(0,10),selectedCase:cases[0].id,expandedCases:new Set([cases[0].id]),analysisPage:{},selectedAnalysis:{},detailTab:'problem',settingsTab:'workspace',wizardStep:1,policy:'default',cache:true};
const roleNames={global:'全局管理员',workspace:'空间管理员',member:'普通成员',viewer:'只读成员'};
function toast(text){const el=$('#toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2400)}
function setView(view){state.view=view;render();window.scrollTo(0,0)}
function pageHead(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div>${action}</div></div>`}
function render(){ $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#workspaceName').textContent=state.workspace;$('#workspaceRole').textContent=roleNames[state.role];$('#userRole').textContent=roleNames[state.role];$('#settingsButton').classList.toggle('hidden',!['global','workspace'].includes(state.role));const main=$('#main');if(state.view==='overview')main.innerHTML=overviewView();if(state.view==='sessions')main.innerHTML=sessionsView();if(state.view==='errors')main.innerHTML=errorsView();if(state.view==='evolution')main.innerHTML=evolutionView();if(state.view==='settings')main.innerHTML=settingsView();bindView()}
function overviewView(){const filtered=filteredCases();const totalSelf=filtered.filter(c=>c.type==='self').length*37+(filtered.length?248:0);const totalDiscovery=filtered.filter(c=>c.type==='discovery').length*29+(filtered.length?183:0);return `<div class="page" data-testid="overview-page">${pageHead('空间总览','从对象与时间维度发现 bad case，再下钻到原始 Session 证据。','<button class="btn" data-action="ingestion">查看上报接入</button>')}
<div class="stats"><div class="card stat"><div><span>Bad cases 总量</span><small>当前空间累计</small></div><strong>1,284</strong></div><div class="card stat"><div><span>本周期新增</span><small>较上周期 +12.4%</small></div><strong>86</strong></div><div class="card stat"><div><span>涉及 Session</span><small>当前筛选范围</small></div><strong>42</strong></div><div class="card stat"><div><span>空间额度</span><small>剩余 3,716 条</small></div><strong>25.7<span style="font-size:14px">%</span></strong></div></div>
<div class="card filters"><div class="field"><label>时间范围</label><select id="timeRange"><option>最近 7 天</option><option>最近 30 天</option><option>自定义时间段</option></select></div><div class="field"><label>统计粒度</label><div class="segmented" id="grainSwitch">${['日','周','月'].map(x=>`<button class="${state.grain===x?'active':''}" data-grain="${x}">${x}</button>`).join('')}</div></div><div class="field"><label>进化对象（不选为全部）</label><details class="multi" id="objectMulti"><summary data-testid="object-multiselect">${state.selectedObjects.size?`已选 ${state.selectedObjects.size} 个对象`:'全部对象'} ⌄</summary><div class="multi-menu">${objects.map(o=>`<label><input type="checkbox" value="${o}" ${state.selectedObjects.has(o)?'checked':''}> ${o}</label>`).join('')}<button class="btn ghost small" id="clearObjects">清空选择</button></div></details></div><div class="field"><label>Bad case 类型</label><div class="segmented" id="typeSwitch">${[['all','全部'],['self','Self'],['discovery','Discovery']].map(([v,l])=>`<button class="${state.type===v?'active':''}" data-type="${v}">${l}</button>`).join('')}</div></div></div>
<div class="overview-grid"><section class="card chart-card"><div class="card-title"><h2>Bad case 趋势</h2><div class="legend"><span><i style="background:#6f9ce9"></i>Self ${totalSelf}</span><span><i style="background:#b7a2e3"></i>Discovery ${totalDiscovery}</span></div></div><div class="chart" data-testid="bad-case-chart">${chartData().map(([d,s,x])=>`<div class="chart-group"><div class="bar self" style="height:${s*1.65}px" data-value="Self ${s}"></div><div class="bar discovery" style="height:${x*1.65}px" data-value="Discovery ${x}"></div><span class="chart-label">${d}</span></div>`).join('')}</div></section>
<aside class="card insight"><div class="card-title"><h3>对象分布</h3><span class="faint">当前时间范围</span></div><div class="insight-list">${objects.map((o,i)=>`<div class="insight-item"><span class="object-mark">${o.slice(0,1).toUpperCase()}</span><div class="grow"><b>${o}</b><div class="progress"><i style="width:${[88,67,45,32][i]}%"></i></div></div><strong>${[428,316,207,151][i]}</strong></div>`).join('')}</div><div class="notice" style="margin-top:20px">Self 表示对象自身上报；Discovery 表示轨迹分析发现。两种类型可同时属于同一对象。</div></aside></div>
${caseTable(filtered)}</div>`}
function chartData(){const filtered=filteredCases(),scale=Math.max(.12,filtered.length/cases.length);const sets={日:[['11/03',54,36],['11/04',72,51],['11/05',48,68],['11/06',82,57],['11/07',62,44],['11/08',95,71],['11/09',76,62]],周:[['W41',168,121],['W42',194,148],['W43',221,169],['W44',186,142],['W45',252,191]],月:[['7 月',480,366],['8 月',552,419],['9 月',638,487],['10 月',704,535],['11 月',428,326]]};return sets[state.grain].map(([d,s,x])=>[d,state.type==='discovery'?0:Math.round(s*scale),state.type==='self'?0:Math.round(x*scale)])}
function filteredCases(){return cases.filter(c=>(!state.selectedObjects.size||state.selectedObjects.has(c.object))&&(state.type==='all'||c.type===state.type))}
function caseTable(filtered){const pages=Math.max(1,Math.ceil(filtered.length/state.pageSize));if(state.page>pages)state.page=pages;const rows=filtered.slice((state.page-1)*state.pageSize,state.page*state.pageSize);return `<section class="card table-card"><div class="table-head"><div><h2>Bad case 列表</h2><span class="faint">组合条件均为可选，点击行进入问题描述</span></div><div class="table-filters"><select aria-label="列表对象筛选" id="tableObject"><option value="">全部 object_name</option>${objects.map(o=>`<option ${state.selectedObjects.size===1&&state.selectedObjects.has(o)?'selected':''}>${o}</option>`).join('')}</select><select aria-label="列表类型筛选" id="tableType"><option value="all">全部类型</option><option value="self" ${state.type==='self'?'selected':''}>self</option><option value="discovery" ${state.type==='discovery'?'selected':''}>discovery</option></select></div></div><table><thead><tr><th>Bad case</th><th>对象</th><th>类型</th><th>发生时间</th><th>Session</th><th>归因</th></tr></thead><tbody>${rows.map(c=>`<tr data-case="${c.id}" data-testid="overview-case-row"><td><strong>${c.title}</strong><span class="cell-sub mono">${c.id}</span></td><td><span class="tag blue">${c.object}</span></td><td><span class="tag ${c.type==='self'?'orange':'purple'}">${c.type}</span></td><td>${c.time}</td><td><span class="mono cell-sub" style="max-width:145px">${c.session}</span></td><td>${c.attributions?`<span class="link">${c.attributions} 条</span>`:'<span class="faint">暂无</span>'}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">没有符合筛选条件的 bad case</div></td></tr>'}</tbody></table><div class="pagination"><span>共 ${filtered.length} 条 · 第 ${state.page}/${pages} 页</span><button id="prevPage" ${state.page===1?'disabled':''}>上一页</button><button id="nextPage" ${state.page===pages?'disabled':''}>下一页</button></div></section>`}
function sessionsView(){const selected=state.sessionResults.find(s=>s.id===state.selectedSession)||state.sessionResults[0];return `<div class="page" data-testid="sessions-page">${pageHead('Session 错误查看','默认仅加载当前空间最新 10 个 Session；输入完整 root session ID 后回车精确查询。')}<div class="session-layout"><aside class="card session-sidebar"><div class="session-search"><div class="search-wrap">${icons.search}<input id="sessionSearch" data-testid="session-search" placeholder="输入 root session ID，回车查询" value="${state.sessionSearch}"></div><div class="search-hint">Enter 精确查询 · 清空后回车恢复最新 10 条</div></div><div style="padding:10px 13px 2px" class="muted">最新 Session <span class="tag">${state.sessionResults.length}</span></div><div class="session-list" data-testid="latest-session-list">${state.sessionResults.map(s=>`<button class="session-item ${selected&&selected.id===s.id?'active':''}" data-session="${s.id}"><div class="session-item-title">${s.title}</div><div class="session-item-meta"><span>${s.time}</span><span>${s.cases} 个问题</span></div><div class="session-item-id mono">${s.id}</div></button>`).join('')||'<div class="empty"><div><strong>未找到该 Session</strong>请检查完整 ID，或清空搜索恢复最新 10 条。</div></div>'}</div></aside><section class="card session-main">${selected?sessionOverview(selected):'<div class="empty"><div><strong>选择一个 Session</strong>查看会话概览与错误详情。</div></div>'}</section></div></div>`}
function sessionOverview(s){return `<div class="session-hero"><div><h2>${s.title}</h2><div class="muted">${s.time} 开始 · ${s.repo}</div><div class="cell-sub mono">根会话 ID · ${s.id}</div></div><button class="btn primary" id="openErrors">打开错误详情 ${icons.chevron}</button></div><div class="metric-strip">${[[s.turns,'用户轮次'],[12,'Agent'],[8,'Skill'],[s.cases,'Bad cases'],[2,'Self'],[s.cases-2,'Discovery']].map(([n,l])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><div class="card-title"><h3>执行流摘要</h3><span class="tag green"><span class="dot"></span>轨迹已归一化</span></div><div class="flow-box"><div class="flow-track"><div class="flow-node">主会话<br><small>${s.turns} turns</small></div><span class="flow-arrow">→</span><div class="flow-node">deep-research<br><small>2 个 bad cases</small></div><span class="flow-arrow">→</span><div class="flow-node orange">workflow<br><small>1 个 discovery</small></div></div></div><div class="notice">Session 树与 bad case 在选中后按需加载。V2 保留现有概览、执行流和深链，仅增加工作空间数据边界。</div>`}
function errorsView(){const selected=cases.find(c=>c.id===state.selectedCase)||cases[0];const analyses=getAnalyses(selected);const activeIndex=state.selectedAnalysis[selected.id]??0;const active=analyses[activeIndex];return `<div class="error-page" data-testid="error-detail-page"><div class="error-head"><div><h1>错误详情</h1><div class="muted mono">根会话 ID · ${selected.session}</div></div><button class="btn" id="backSessions">← 返回 Session</button></div><div class="error-layout"><aside class="card case-sidebar"><div style="padding:6px 6px 10px"><b>Bad cases</b><span class="faint"> · 展开查看各对象归因</span></div>${cases.slice(0,5).map(c=>caseGroup(c)).join('')}</aside><section class="card error-main"><div class="flow-box"><div class="card-title"><h3>执行流</h3><span class="tag blue">${selected.object}</span></div><div class="flow-track"><div class="flow-node">主会话<br><small>23 turns</small></div><span class="flow-arrow">→</span><div class="flow-node">${selected.object}<br><small>触发点 L120</small></div><span class="flow-arrow">→</span><div class="flow-node orange">bad case<br><small>触发点 L156</small></div></div></div><div class="detail-box"><div class="tabs"><button class="tab ${state.detailTab==='problem'?'active':''}" data-tab="problem">问题描述</button><button class="tab ${state.detailTab==='attribution'?'active':''}" data-tab="attribution" ${!active?'disabled':''}>归因分析 ${active?`<span class="tag purple">${active.target}</span>`:''}</button></div>${state.detailTab==='problem'||!active?problemDetail(selected):attributionDetail(selected,active)}</div></section></div></div>`}
function getAnalyses(c){return Array.from({length:c.attributions},(_,i)=>({target:objects[i%objects.length],version:['v2.4.1','v2.3.0','v2.2.3'][i%3],status:i===2?'非该对象问题':'已归因',time:`2026-11-0${9-Math.floor(i/2)} ${15-i}:20`,cached:i%2===0,run:`EV-2026110${9-i}-0${i+1}`}))}
function caseGroup(c){const analyses=getAnalyses(c),expanded=state.expandedCases.has(c.id),page=state.analysisPage[c.id]||1,pages=Math.max(1,Math.ceil(analyses.length/2)),visible=analyses.slice((page-1)*2,page*2);return `<div class="case-group ${state.selectedCase===c.id?'selected':''}"><div class="case-row"><button class="case-toggle" aria-label="${expanded?'折叠':'展开'}归因" data-expand="${c.id}" data-testid="case-attribution-toggle">${expanded?'⌄':'›'}</button><button class="case-main" data-select-case="${c.id}"><span class="mono faint">${c.id}</span><strong>${c.title}</strong><span class="case-meta"><span class="tag ${c.type==='self'?'orange':'purple'}">${c.type}</span><span class="faint">${c.object}</span></span></button><span class="tag">${c.attributions}</span></div>${expanded?`<div class="analysis-list">${visible.map((a,i)=>{const actual=(page-1)*2+i;return `<button class="analysis-item ${state.selectedCase===c.id&&(state.selectedAnalysis[c.id]??0)===actual&&state.detailTab==='attribution'?'active':''}" data-analysis="${actual}" data-case-id="${c.id}"><span class="dot" style="color:${a.status==='非该对象问题'?'var(--orange)':'var(--green)'}"></span><span class="grow"><b>${a.target} · ${a.version}</b><small>${a.status} · ${a.time}</small></span>${a.cached?'<span class="tag blue">缓存</span>':''}</button>`}).join('')||'<div class="empty" style="min-height:100px"><div><strong>暂无归因</strong>启动自进化后生成</div></div>'}${pages>1?`<div class="analysis-pages"><button data-analysis-page="${page-1}" data-case-id="${c.id}" ${page===1?'disabled':''}>← 上一页</button><span>${page} / ${pages}</span><button data-analysis-page="${page+1}" data-case-id="${c.id}" ${page===pages?'disabled':''}>下一页 →</button></div>`:''}</div>`:''}</div>`}
function problemDetail(c){return `<div class="detail-content" data-testid="problem-description"><span class="tag ${c.type==='self'?'orange':'purple'}">${c.type}</span><h2 style="margin-top:10px">${c.title}</h2><p class="reasoning">${c.object} 在执行过程中触发了可复现的异常。该问题由 ${c.type==='self'?'对象主动上报':'后续轨迹分析发现'}，原始证据已锚定到当前 Session 的执行流。</p><div class="fact-grid"><div class="fact"><span>Bad case ID</span><b class="mono">${c.id}</b></div><div class="fact"><span>发生时间</span><b>${c.time}</b></div><div class="fact"><span>期望行为</span>正确完成当前步骤并保留结构化结果</div><div class="fact"><span>实际行为</span>${c.title}，后续步骤未获得有效输入</div></div><div class="notice">问题描述与归因解耦：同一 bad case 可保留多个进化对象版本的归因结论。</div></div>`}
function attributionDetail(c,a){return `<div class="detail-content" data-testid="attribution-detail"><div class="conclusion ${a.status==='非该对象问题'?'not-target':''}"><b>${a.status==='非该对象问题'?'非该对象问题':'可归因到 '+a.target}</b><div>${a.target} · ${a.version} · ${a.run}</div></div><h2>归因分析</h2><p class="reasoning">对象触发点位于 L120，bad case 触发点位于 L156。默认潜在策略命中，因此本次自进化运行对该问题进行了对象级归因。</p><div class="fact-grid"><div class="fact"><span>结论</span><b>${a.status}</b></div><div class="fact"><span>结果来源</span>${a.cached?'复用最近一次成功归因':'本次运行新增'}</div><div class="fact"><span>潜在策略</span>self + 对象触发点之后</div><div class="fact"><span>归因时间</span>${a.time}</div></div><h3>推导过程</h3><p class="reasoning">1. 确认对象版本在当前 Session 中出现。<br>2. 对齐对象与 bad case 的轨迹触发点。<br>3. 检查异常输入是否由该对象输出直接产生。<br>4. 结论仅作用于 ${a.target} ${a.version}，不改变 bad case 对其他对象的潜在关系。</p></div>`}
function evolutionView(){return `<div class="page" data-testid="evolution-page">${pageHead('自进化','从当前工作空间的潜在 bad case 出发，完成对象归因、聚类、修复与评测。','<button class="btn purple" id="launchWizard">＋ 启动自进化</button>')}<div class="stats"><div class="card stat"><div><span>进行中</span><small>归因与聚类阶段</small></div><strong>2</strong></div><div class="card stat"><div><span>本周归因</span><small>含缓存复用 38 条</small></div><strong>126</strong></div><div class="card stat"><div><span>潜在 bad case</span><small>当前空间待处理</small></div><strong>74</strong></div><div class="card stat"><div><span>已接纳改进</span><small>本月累计</small></div><strong>18</strong></div></div><div class="card-title"><h2>运行记录</h2><button class="link btn ghost" id="targetConfig">进化对象配置 →</button></div><div class="run-grid">${[['deep-research v2.4.1 自进化','running','32','8','65%'],['workflow v1.9.0 自进化','completed','48','12','100%'],['code-reviewer v3.2.0 自进化','completed','27','6','100%']].map(([t,s,n,c,p])=>`<article class="card run-card"><div><h3>${t} <span class="tag ${s==='running'?'blue':'green'}">${s==='running'?'进行中':'已完成'}</span></h3><div class="run-meta"><span class="tag purple">默认潜在策略</span><span class="tag">最近 7 天</span><span class="tag">复用缓存</span></div></div><div class="run-stats"><div><strong>${n}</strong><span>潜在 bad case</span></div><div><strong>${c}</strong><span>问题簇</span></div></div><div style="min-width:140px"><div class="muted">${s==='running'?'对象归因中':'查看运行详情'}</div><div class="progress"><i style="width:${p};background:var(--purple)"></i></div></div></article>`).join('')}</div></div>`}
function settingsView(){const isGlobal=state.role==='global';return `<div class="page" data-testid="settings-page">${pageHead(isGlobal?'工作空间管理':'空间设置',isGlobal?'管理空间、成员角色与上报额度。全局管理员仅有一个账号。':'管理当前空间的成员、额度与上报接入。')}<div class="settings-layout"><aside class="card settings-nav"><button class="${state.settingsTab==='workspace'?'active':''}" data-settings="workspace">空间与额度</button><button data-settings="members" class="${state.settingsTab==='members'?'active':''}">成员与角色</button><button data-settings="ingestion" class="${state.settingsTab==='ingestion'?'active':''}">上报接入</button></aside><section class="card settings-content">${settingsContent(isGlobal)}</section></div></div>`}
function settingsContent(isGlobal){if(state.settingsTab==='members')return `<div class="settings-section-head"><div><h2>成员与角色</h2><span class="muted">空间管理员拥有本空间全部操作权限，可配置多个。</span></div><button class="btn primary" id="addMember">＋ 添加成员</button></div><table><thead><tr><th>用户</th><th>空间角色</th><th>加入时间</th><th>操作</th></tr></thead><tbody>${[['林澈','admin@harness.dev','空间管理员','2026-10-18'],['周岚','zhoulan@harness.dev','空间管理员','2026-10-20'],['陈默','chenmo@harness.dev','成员','2026-11-02'],['许知','xuzhi@harness.dev','只读成员','2026-11-06']].map(([n,e,r,d])=>`<tr style="cursor:default"><td><strong>${n}</strong><span class="cell-sub">${e}</span></td><td><select class="input" style="min-width:120px;padding:5px"><option ${r==='空间管理员'?'selected':''}>空间管理员</option><option ${r==='成员'?'selected':''}>成员</option><option ${r==='只读成员'?'selected':''}>只读成员</option></select></td><td>${d}</td><td><button class="btn ghost small danger">移除</button></td></tr>`).join('')}</tbody></table>`;if(state.settingsTab==='ingestion')return ingestionContent();return `<div class="settings-section-head"><div><h2>${isGlobal?'全部工作空间':'当前工作空间'}</h2><span class="muted">额度按空间累计 bad case 数量计算，可在创建后调整。</span></div>${isGlobal?'<button class="btn primary" id="createWorkspace">＋ 创建工作空间</button>':''}</div><div class="workspace-summary">${(isGlobal?['AI Agent 研发','客服 Copilot']:['AI Agent 研发']).map((w,i)=>`<div class="quota-box"><div class="card-title"><h3>${w}</h3><span class="tag green">运行中</span></div><div class="quota-number">${i?386:1284} <span class="muted" style="font-size:13px">/ ${i?2000:5000}</span></div><div class="progress"><i style="width:${i?19.3:25.7}%"></i></div><div style="margin-top:12px;display:flex;justify-content:space-between"><span class="muted">${i?4:8} 名成员 · ${i?1:2} 名空间管理员</span><button class="btn small" data-edit-workspace="${w}">调整额度</button></div></div>`).join('')}</div><div class="notice">空间身份由服务端鉴权与 membership 判定；前端隐藏入口不能替代 API 权限校验。</div>`}
function ingestionContent(){return `<div class="settings-section-head"><div><h2>Bad case 上报接入</h2><span class="muted">请求体沿用 bad_cases 类型，空间身份由 URL 与服务端凭据确定。</span></div><button class="btn" id="rotateToken">轮换凭据</button></div><div class="endpoint"><span class="method">POST</span><span class="mono">/api/workspaces/ws_ai_agent/bad-cases</span><button class="btn small" style="margin-left:auto">复制</button></div><div class="code">{
  "object_name": "deep-research",
  "bad_case_type": "self",
  "root_session_id": "cb819c5b-286f-4eab-a681-4ba5414b844d",
  "title": "检索结果反序列化失败",
  "bad_case_description": "…",
  "trigger_point": { "agent_id": "research-01", "line": 156 },
  "occurred_at": "2026-11-09T14:32:00+08:00"
}</div><div class="workspace-summary"><div class="quota-box"><span class="muted">上报凭据</span><div class="mono" style="margin:8px 0">he_ws_••••••••••••7K2P</div><span class="tag green">有效</span></div><div class="quota-box"><span class="muted">额度使用</span><div class="quota-number">1,284 / 5,000</div><span class="faint">达到上限时写入返回 409 QUOTA_EXCEEDED</span></div></div>`}
function bindView(){
$$('[data-grain]').forEach(b=>b.onclick=()=>{state.grain=b.dataset.grain;render()});$$('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.page=1;render()});
$$('#objectMulti input').forEach(i=>i.onchange=()=>{i.checked?state.selectedObjects.add(i.value):state.selectedObjects.delete(i.value);state.page=1;render();$('#objectMulti').open=true});const clear=$('#clearObjects');if(clear)clear.onclick=()=>{state.selectedObjects.clear();render()};
const tableType=$('#tableType');if(tableType)tableType.onchange=e=>{state.type=e.target.value;state.page=1;render()};const tableObject=$('#tableObject');if(tableObject)tableObject.onchange=e=>{state.selectedObjects.clear();if(e.target.value)state.selectedObjects.add(e.target.value);state.page=1;render()};
$$('[data-case]').forEach(r=>r.onclick=()=>{state.selectedCase=r.dataset.case;state.detailTab='problem';state.view='errors';render()});
const prev=$('#prevPage');if(prev)prev.onclick=()=>{state.page--;render()};const next=$('#nextPage');if(next)next.onclick=()=>{state.page++;render()};
$$('[data-session]').forEach(b=>b.onclick=()=>{state.selectedSession=b.dataset.session;render()});const search=$('#sessionSearch');if(search)search.onkeydown=e=>{if(e.key!=='Enter')return;state.sessionSearch=search.value.trim();if(!state.sessionSearch){state.sessionResults=sessions.slice(0,10)}else{const found=sessions.find(s=>s.id===state.sessionSearch);state.sessionResults=found?[found]:[]}if(state.sessionResults[0])state.selectedSession=state.sessionResults[0].id;render();toast(state.sessionResults.length?'已精确查询 Session':'未找到对应 Session')};
const open=$('#openErrors');if(open)open.onclick=()=>setView('errors');const back=$('#backSessions');if(back)back.onclick=()=>setView('sessions');
$$('[data-expand]').forEach(b=>b.onclick=()=>{const id=b.dataset.expand;state.expandedCases.has(id)?state.expandedCases.delete(id):state.expandedCases.add(id);render()});$$('[data-select-case]').forEach(b=>b.onclick=()=>{state.selectedCase=b.dataset.selectCase;state.detailTab='problem';render()});
$$('[data-analysis]').forEach(b=>b.onclick=()=>{state.selectedCase=b.dataset.caseId;state.selectedAnalysis[state.selectedCase]=Number(b.dataset.analysis);state.detailTab='attribution';render()});$$('[data-analysis-page]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.analysisPage);if(p<1)return;state.analysisPage[b.dataset.caseId]=p;render()});
$$('[data-tab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.tab;render()});const launch=$('#launchWizard');if(launch)launch.onclick=()=>{state.wizardStep=1;wizardModal()};const target=$('#targetConfig');if(target)target.onclick=()=>toast('进化对象配置沿用现有页面，并限定在当前工作空间');
$$('[data-settings]').forEach(b=>b.onclick=()=>{state.settingsTab=b.dataset.settings;render()});const create=$('#createWorkspace');if(create)create.onclick=()=>workspaceModal();$$('[data-edit-workspace]').forEach(b=>b.onclick=()=>workspaceModal(b.dataset.editWorkspace));const add=$('#addMember');if(add)add.onclick=memberModal;const rotate=$('#rotateToken');if(rotate)rotate.onclick=()=>toast('凭据轮换需二次确认；原型不生成真实密钥');$$('[data-action="ingestion"]').forEach(b=>b.onclick=()=>{if(['global','workspace'].includes(state.role)){state.settingsTab='ingestion';setView('settings')}else toast('当前角色仅可查看数据，上报配置由空间管理员维护')});
}
function modal(title,sub,body,foot='',wide=false){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2><p>${sub}</p></div><button class="modal-close" id="modalClose" aria-label="关闭">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;$('#modalClose').onclick=closeModal;$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function workspaceModal(name=''){modal(name?'调整工作空间':'创建工作空间',name||'创建后可继续调整额度，并配置多个空间管理员。',`<div class="form-grid"><div class="field full"><label>空间名称</label><input id="wsName" value="${name}" ${name?'disabled':''} placeholder="例如：AI Agent 研发"></div><div class="field"><label>Bad case 数量上限</label><input id="wsQuota" type="number" value="${name?5000:10000}" min="1"></div><div class="field"><label>空间管理员</label><select multiple style="height:38px"><option selected>林澈（当前账号）</option><option>周岚</option></select></div><div class="notice full">只有全局管理员可以创建工作空间。空间管理员可管理本空间的成员、上报、对象配置和自进化。</div></div>`,`<span class="faint">额度在服务端写入事务内校验</span><div class="modal-actions"><button class="btn" id="cancelWs">取消</button><button class="btn primary" id="saveWs">${name?'保存调整':'创建空间'}</button></div>`);$('#cancelWs').onclick=closeModal;$('#saveWs').onclick=()=>{closeModal();toast(name?'空间额度已更新':'工作空间已创建')}}
function memberModal(){modal('添加空间成员','仅添加已存在的平台用户，不开放外部注册。',`<div class="form-grid"><div class="field full"><label>用户账号</label><input placeholder="输入邮箱或用户名搜索"></div><div class="field full"><label>空间角色</label><select><option>成员</option><option>只读成员</option><option>空间管理员</option></select></div><div class="notice full">空间管理员拥有本空间全部操作权限；全局账号与空间创建仍由唯一全局管理员控制。</div></div>`,`<div></div><div class="modal-actions"><button class="btn" id="cancelMember">取消</button><button class="btn primary" id="saveMember">添加成员</button></div>`);$('#cancelMember').onclick=closeModal;$('#saveMember').onclick=()=>{closeModal();toast('成员已添加')}}
function wizardModal(){const step=state.wizardStep;const steps=`<div class="steps">${['选择范围','关联与筛选','归因与启动'].map((x,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${step===i+1?'active':step>i+1?'done':''}"><i>${step>i+1?'✓':i+1}</i>${x}</div>`).join('')}</div>`;let body='';if(step===1)body=`<div class="form-grid"><div class="field full"><label>进化对象</label><select id="wizardTarget"><option>deep-research · Skill</option><option>workflow · Workflow</option><option>code-reviewer · Agent</option></select></div><div class="field full"><label>进化对象版本</label><select><option>v2.4.1（当前稳定版本）</option><option>v2.3.0</option></select></div><div class="field"><label>Bad case 开始时间</label><input type="datetime-local" value="2026-11-03T00:00"></div><div class="field"><label>Bad case 结束时间</label><input type="datetime-local" value="2026-11-09T23:59"></div><div class="notice full">先查时间窗内上报 bad case 的 Session，再判断所选对象版本是否出现；未出现的 Session 不进入后续归因。</div></div>`;if(step===2)body=`<div class="pipeline"><div class="pipeline-node"><span>时间窗内 Session</span><strong>42</strong></div><div class="pipeline-arrow">→</div><div class="pipeline-node"><span>对象关联 Session</span><strong>18</strong></div><div class="pipeline-arrow">→</div><div class="pipeline-node"><span>潜在 bad case</span><strong>32</strong></div></div><div class="policy ${state.policy==='default'?'selected':''}"><label><input type="radio" name="policy" value="default" ${state.policy==='default'?'checked':''}>默认潜在匹配策略</label><p>对象自身上报的 self bad case，或触发点在对象触发点之后的 bad case。每个关联 Session 分别对齐对象与 bad case 触发点。</p></div><div class="policy ${state.policy==='custom'?'selected':''}"><label><input type="radio" name="policy" value="custom" ${state.policy==='custom'?'checked':''}>使用自定义策略</label><p>策略保存版本并写入运行快照，不在前端执行任意代码。</p>${state.policy==='custom'?'<textarea id="customPolicy">包含对象自身 self；discovery 需满足 bad_case.line - target.line ≤ 200，且位于同一执行分支。</textarea>':''}</div><button class="btn small" id="viewPotential">查看 32 条潜在 bad case 与触发点证据</button>`;if(step===3)body=`<div class="preview-stats"><div class="preview-stat"><span>潜在 bad case</span><strong>32</strong></div><div class="preview-stat"><span>复用最近归因</span><strong style="color:var(--blue)">18</strong></div><div class="preview-stat"><span>新增归因</span><strong style="color:var(--purple)">14</strong></div><div class="preview-stat"><span>关联 Session</span><strong>18</strong></div></div><div class="cache-option"><div><b>使用缓存结果</b><div class="muted">对象版本已对某潜在 bad case 做过归因时，复用最近一次成功结果。</div></div><label class="switch"><input id="cacheToggle" type="checkbox" ${state.cache?'checked':''}><span class="slider"></span></label></div><div class="notice" style="margin-top:14px">缓存键包含工作空间、bad case、对象版本、策略版本和归因模型版本。“非该对象问题”也是可复用的对象级结论。</div>`;modal('启动自进化',`deep-research · v2.4.1 · 第 ${step}/3 步`,steps+body,`<span class="faint">${step===2?'已排除 24 个对象未出现的 Session':step===3?'启动后保存潜在集与策略快照':'所有条件均限定在当前工作空间'}</span><div class="modal-actions">${step>1?'<button class="btn" id="wizardPrev">上一步</button>':''}<button class="btn purple" id="wizardNext">${step===3?'确认启动':'下一步'}</button></div>`,true);$$('input[name="policy"]').forEach(r=>r.onchange=()=>{state.policy=r.value;wizardModal()});const cache=$('#cacheToggle');if(cache)cache.onchange=()=>state.cache=cache.checked;const prev=$('#wizardPrev');if(prev)prev.onclick=()=>{state.wizardStep--;wizardModal()};const view=$('#viewPotential');if(view)view.onclick=()=>toast('预览包含 Session、对象触发点、bad case 触发点和命中原因');$('#wizardNext').onclick=()=>{if(step<3){state.wizardStep++;wizardModal()}else{closeModal();toast('自进化运行已创建，正在执行对象归因')}}}
$('#workspaceButton').onclick=()=>$('#workspaceMenu').classList.toggle('hidden');$$('[data-workspace]').forEach(b=>b.onclick=()=>{state.workspace=b.dataset.workspace;state.page=1;state.sessionResults=sessions.slice(0,10);$('#workspaceMenu').classList.add('hidden');render();toast(`已切换到 ${state.workspace}`)});$('#manageWorkspaces').onclick=()=>{$('#workspaceMenu').classList.add('hidden');setView('settings')};$('#settingsButton').onclick=()=>setView('settings');$('#userButton').onclick=()=>$('#userPopover').classList.toggle('hidden');$$('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#roleSwitch').onchange=e=>{state.role=e.target.value;render();toast(`已切换为${roleNames[state.role]}视图`)};$('#loginPreview').onclick=()=>{$('#userPopover').classList.add('hidden');$('#app').classList.add('hidden');$('#loginView').classList.remove('hidden')};$('#loginForm').onsubmit=e=>{e.preventDefault();$('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');setView('overview')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
