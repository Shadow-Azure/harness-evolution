<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自进化 · UI 原型</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bg-panel: #fafbfc;
    --bg-card: #ffffff;
    --border: #e2e5ea;
    --text: #212832;
    --text-dim: #5a6372;
    --text-faint: #9aa2ae;
    --blue: #2f6fe0;
    --green: #1f9d6b;
    --orange: #d97b1c;
    --red: #d63c3c;
    --purple: #8a55c9;
    --cyan: #158a8a;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.55;
  }
  /* ── 顶栏 ─────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 16px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .logo { font-weight: 650; font-size: 13.5px; letter-spacing: .2px; }
  .env-badge {
    font-size: 11px; color: var(--purple);
    border: 1px solid color-mix(in srgb, var(--purple) 45%, transparent);
    background: color-mix(in srgb, var(--purple) 12%, transparent);
    padding: 1px 8px; border-radius: 999px;
  }
  .topbar .spacer { flex: 1; }
  .navlink { font-size: 12px; color: var(--text-dim); text-decoration: none; }
  .navlink:hover { color: var(--blue); }
  /* ── 通用 ─────────────────────────── */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 24px 64px; }
  .btn {
    font: inherit; font-size: 12.5px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-card); color: var(--text-dim); padding: 6px 14px;
  }
  .btn:hover { border-color: #c4cbd6; color: var(--text); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .chip {
    display: inline-block; font-size: 11px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
    background: var(--bg-card); white-space: nowrap;
  }
  .chip.model { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 35%, transparent); background: color-mix(in srgb, var(--cyan) 9%, transparent); }
  .chip.kind { font-family: var(--mono); font-size: 10.5px; color: var(--purple); border-color: color-mix(in srgb, var(--purple) 35%, transparent); background: color-mix(in srgb, var(--purple) 9%, transparent); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .badge.running { color: var(--blue); background: color-mix(in srgb, var(--blue) 13%, transparent); }
  .badge.done-ok { color: var(--green); background: color-mix(in srgb, var(--green) 13%, transparent); }
  .badge.done-no { color: var(--text-dim); background: color-mix(in srgb, var(--text-faint) 22%, transparent); }
  .badge.accepted { color: var(--green); background: color-mix(in srgb, var(--green) 13%, transparent); }
  .badge.rejected { color: var(--red); background: color-mix(in srgb, var(--red) 11%, transparent); }
  .badge.pending { color: var(--text-faint); background: color-mix(in srgb, var(--text-faint) 18%, transparent); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 1.4s infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .mono { font-family: var(--mono); }
  .delta-pos { color: var(--green); font-family: var(--mono); font-weight: 600; }
  .delta-neg { color: var(--red); font-family: var(--mono); font-weight: 600; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 3px rgba(30,40,60,.05); }
  .sec-title { font-size: 13.5px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title .sub { font-size: 11.5px; color: var(--text-faint); font-weight: 400; }
  /* ── 列表页 ────────────────────────── */
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .page-head h1 { font-size: 18px; font-weight: 700; }
  .page-head .spacer { flex: 1; }
  .page-note { font-size: 12px; color: var(--text-faint); margin-bottom: 20px; }
  .group-label { font-size: 12px; color: var(--text-faint); font-weight: 600; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  .run-list { display: flex; flex-direction: column; gap: 12px; }
  .run-card { padding: 14px 16px; cursor: pointer; transition: border-color .12s; }
  .run-card:hover { border-color: var(--blue); }
  .run-card .r1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .run-card .title { font-weight: 650; font-size: 14px; }
  .run-card .time { margin-left: auto; font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }
  .run-card .r2 { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--text-dim); }
  .run-stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .run-stats .st b { font-family: var(--mono); font-weight: 600; margin-right: 3px; }
  .run-stats .st span { color: var(--text-faint); font-size: 11px; }
  .run-progress { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .run-progress .bar { flex: 1; height: 6px; background: #e8ebf0; border-radius: 3px; overflow: hidden; }
  .run-progress .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--blue) 55%, #fff), var(--blue)); transition: width .4s; }
  .run-progress .txt { font-size: 11px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; }
  .final-line { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
  /* ── 详情页 ────────────────────────── */
  .back { font-size: 12px; color: var(--text-dim); text-decoration: none; }
  .back:hover { color: var(--blue); }
  .detail-head { display: flex; align-items: center; gap: 10px; margin: 12px 0 18px; flex-wrap: wrap; }
  .detail-head h1 { font-size: 17px; font-weight: 700; }
  .detail-head .spacer { flex: 1; }
  .panel { padding: 16px 18px; margin-bottom: 16px; }
  .kv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 20px; margin-bottom: 14px; }
  .kv .k { font-size: 11px; color: var(--text-faint); margin-bottom: 2px; }
  .kv .v { font-size: 13px; font-weight: 600; }
  .kv .v.big { font-family: var(--mono); font-size: 15px; }
  .kv .v.big.accent { color: var(--blue); }
  .typebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 8px; }
  .typebar span { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); }
  .legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .legend b { font-family: var(--mono); }
  /* 流程 stepper */
  .stepper { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 4px 2px; }
  .step { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .step .ico {
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 1.5px solid var(--border); color: var(--text-faint); background: var(--bg-card);
  }
  .step.done .ico { background: var(--green); border-color: var(--green); color: #fff; }
  .step.active .ico { border-color: var(--blue); color: var(--blue); }
  .step .lbl { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .step.done .lbl { color: var(--text); }
  .step.active .lbl { color: var(--blue); font-weight: 600; }
  .conn { width: 34px; height: 1.5px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
  .conn.done { background: var(--green); }
  /* 聚类条目 */
  .cluster { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--bg-card); }
  .cluster-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; flex-wrap: wrap; }
  .cluster-head:hover { background: var(--bg-panel); }
  .rank { font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; background: var(--orange); border-radius: 6px; padding: 1px 7px; }
  .cluster-head .cid { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .cluster-head .ctitle { font-weight: 600; font-size: 13px; }
  .cluster-head .meta { font-size: 11.5px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; }
  .cluster-head .tail { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sev { display: flex; align-items: center; gap: 6px; }
  .sev .bar { width: 56px; height: 5px; border-radius: 3px; background: #e8ebf0; overflow: hidden; }
  .sev .fill { height: 100%; border-radius: 3px; }
  .caret { color: var(--text-faint); font-size: 11px; transition: transform .15s; }
  .cluster.open .caret { transform: rotate(90deg); }
  .cluster-body { border-top: 1px solid var(--border); padding: 14px 16px; display: none; }
  .cluster.open .cluster-body { display: block; }
  .cb-sec { margin-bottom: 14px; }
  .cb-sec:last-child { margin-bottom: 0; }
  .cb-label { font-size: 11px; color: var(--text-faint); font-weight: 600; margin-bottom: 6px; }
  .report-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .report-chip { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; background: var(--bg-panel); }
  .attr-line { font-size: 12px; color: var(--text-dim); }
  .attr-line b { color: var(--text); }
  /* diff */
  .diff { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-family: var(--mono); font-size: 11.5px; }
  .diff .fhead { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 5px 10px; color: var(--text-dim); font-size: 11px; }
  .dline { padding: 1px 10px; white-space: pre-wrap; word-break: break-all; }
  .dline.add { background: color-mix(in srgb, var(--green) 11%, transparent); color: #146c4a; }
  .dline.del { background: color-mix(in srgb, var(--red) 9%, transparent); color: #a02c2c; }
  .dline.hunk { color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, transparent); }
  .dline.ctx { color: var(--text-dim); }
  /* 评测对比 */
  .evalcmp { display: flex; flex-direction: column; gap: 6px; max-width: 560px; }
  .evalrow { display: flex; align-items: center; gap: 10px; font-size: 11.5px; }
  .evalrow .who { width: 92px; color: var(--text-dim); flex-shrink: 0; }
  .evalrow .bar { flex: 1; height: 8px; background: #e8ebf0; border-radius: 4px; overflow: hidden; }
  .evalrow .fill { height: 100%; border-radius: 4px; }
  .evalrow .val { font-family: var(--mono); font-weight: 600; width: 44px; text-align: right; }
  /* commit */
  .commit { border: 1px solid color-mix(in srgb, var(--green) 35%, transparent); background: color-mix(in srgb, var(--green) 6%, transparent); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; }
  .commit .hash { color: var(--green); font-weight: 700; }
  .commit .cline { color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }
  .reject-note { border: 1px dashed var(--border); border-radius: 8px; padding: 9px 12px; font-size: 12px; color: var(--text-dim); }
  /* 最终结果 */
  .verdict { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; margin-bottom: 14px; }
  .verdict.ok { background: color-mix(in srgb, var(--green) 10%, transparent); border: 1px solid color-mix(in srgb, var(--green) 35%, transparent); }
  .verdict.no { background: color-mix(in srgb, var(--text-faint) 10%, transparent); border: 1px solid var(--border); }
  .verdict .big { font-size: 15px; font-weight: 700; }
  .verdict .desc { font-size: 12px; color: var(--text-dim); }
  table.metrics { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.metrics th, table.metrics td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.metrics th { font-size: 11px; color: var(--text-faint); font-weight: 600; }
  table.metrics td.num { font-family: var(--mono); }
  .changes-list { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .changes-list .ch { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .waiting { padding: 18px; text-align: center; color: var(--text-faint); font-size: 12.5px; border: 1px dashed var(--border); border-radius: 10px; }
  /* ── 启动向导 modal ─────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(25,32,44,.42); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; z-index: 50; overflow-y: auto; }
  .modal { width: 720px; max-width: 100%; background: var(--bg-card); border-radius: 14px; box-shadow: 0 18px 60px rgba(20,30,50,.25); overflow: hidden; }
  .modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { font-size: 15px; font-weight: 700; }
  .modal-head .x { margin-left: auto; cursor: pointer; color: var(--text-faint); font-size: 16px; border: none; background: none; }
  .modal-body { padding: 18px; max-height: 66vh; overflow-y: auto; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 13px 18px; border-top: 1px solid var(--border); background: var(--bg-panel); }
  .f-row { margin-bottom: 14px; }
  .f-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
  .f-label .req { color: var(--red); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; padding: 6px 16px; border: none; background: var(--bg-card); color: var(--text-dim); cursor: pointer; }
  .seg button.active { background: var(--blue); color: #fff; font-weight: 600; }
  select.inp, input.inp {
    font: inherit; font-size: 12.5px; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--bg-card); outline: none;
  }
  select.inp:focus, input.inp:focus { border-color: var(--blue); }
  .f-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick .opt {
    font-size: 12px; cursor: pointer; user-select: none; border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 12px; color: var(--text-dim); background: var(--bg-card);
    font-family: var(--mono);
  }
  .pick .opt.on { color: var(--text); border-color: var(--blue); background: color-mix(in srgb, var(--blue) 13%, transparent); }
  .match-summary { border: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); background: color-mix(in srgb, var(--blue) 6%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
  .match-summary b { font-family: var(--mono); }
  table.rep { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  table.rep th, table.rep td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.rep th { font-size: 11px; color: var(--text-faint); font-weight: 600; }
  table.rep td.id { font-family: var(--mono); color: var(--blue); }
  .wz-steps { display: flex; gap: 8px; font-size: 11.5px; color: var(--text-faint); margin-bottom: 16px; }
  .wz-steps .on { color: var(--blue); font-weight: 600; }
  /* 仅聚类页 banner */
  .banner { border: 1px solid color-mix(in srgb, var(--orange) 40%, transparent); background: color-mix(in srgb, var(--orange) 8%, transparent); border-radius: 10px; padding: 11px 14px; font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .banner .spacer { flex: 1; }
</style>
</head>

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hashStr(s){ let h=7; for (const c of s) h=(h*31 + c.charCodeAt(0))>>>0; return h; }
function fmtDelta(x, unit){ const v = (x>0?'+':'') + x.toFixed(1) + (unit||''); return x >= 0 ? `<span class="delta-pos">${v}</span>` : `<span class="delta-neg">${v}</span>`; }
function confPct(c){ return (c*100).toFixed(0) + '%'; }

const TYPE_COLOR = {

};
function typeChip(t){ const c = TYPE_COLOR[t] || '#9aa2ae'; return `<span class="chip" style="color:${c};border-color:color-mix(in srgb, ${c} 40%, transparent);background:color-mix(in srgb, ${c} 9%, transparent)">${esc(t)}</span>`; }
function sevHTML(sev){
  const pct = sev * 10;
  const color = sev >= 8 ? 'var(--red)' : sev >= 6 ? 'var(--orange)' : 'var(--text-faint)';
  return `<span class="sev"><span class="bar"><span class="fill" style="width:${pct}%;background:${color}"></span></span><span class="mono" style="font-size:11px;color:${color};font-weight:600">${sev.toFixed(1)}</span></span>`;
}
function reportIds(seed, n){ const out=[]; let h=hashStr(seed); for(let i=0;i<n;i++){ h=(h*31+17)>>>0; out.push('R-'+(1000+(h%900))); } return out; }

function statusBadge(run){
  if (!isDone(run)) return `<span class="badge running"><span class="pulse"></span>正在执行</span>`;
  return run.final.verdict
    ? `<span class="badge done-ok">✓ 已完成 · 自进化有效</span>`
    : `<span class="badge done-no">已完成 · 无收益</span>`;
}
function runCard(run){
  const total = TOTAL_UNITS(run);
  const pct = Math.min(100, Math.round(run.progress / total * 100));
  const accepted = run.clusters.filter((c, i) => roundDone(run, i) && c.accepted).length;
  const doneRounds = run.clusters.filter((c, i) => roundDone(run, i)).length;
  let tail;
  if (!isDone(run)) {
    const M = run.clusters.length;
    const STEP_NAMES = ['筛选输入', '问题聚类', 'LLM 归因置信度', '严重程度排序', '迭代优化', '测试集终评'];
    let stage;
    if (run.progress < 4) stage = `第 ${run.progress + 1}/6 步 · ${STEP_NAMES[run.progress]}中…`;
    else if (run.progress < 4 + M) stage = `第 5/6 步 · 迭代优化 · 第 ${run.progress - 3}/${M} 轮`;
    else stage = `第 6/6 步 · 测试集终评中…`;
    tail = `<div class="run-progress"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="txt">${esc(stage)} · ${pct}%</span></div>`;
  } else {
    tail = `<div class="final-line">
      <span style="color:var(--text-dim)">best <b class="mono">${run.final.bestScore.toFixed(1)}</b> vs 初始 <b class="mono">${run.final.initScore.toFixed(1)}</b></span>
      ${fmtDelta(run.final.bestScore - run.final.initScore)}
      <span style="color:var(--text-faint)">· 接纳 ${accepted}/${run.clusters.length} 个 patch</span>
    </div>`;
  }
  return `<div class="card run-card" data-action="open-run" data-id="${run.id}">
    <div class="r1">
      <span class="title">${esc(run.title)}</span>
      ${statusBadge(run)}
      <span class="time">${run.createdAt}</span>
    </div>
    <div class="r2">
      <span class="chip kind">${run.target.kind}:${esc(run.target.name)}@${run.target.version}</span>
      <span class="mono" style="font-size:11px">${run.window[0]} ~ ${run.window[1]}</span>
      ${run.models.map(m => `<span class="chip model">${esc(m)}</span>`).join('')}
    </div>
    <div class="run-stats">
      <span class="st"><b>${run.stats.sessions}</b><span>session</span></span>
      <span class="st"><b>${run.stats.reports}</b><span>问题报告</span></span>
      <span class="st"><b>${run.stats.used}</b><span>用于进化</span></span>
      <span class="st"><b>${run.clusters.length}</b><span>聚类</span></span>
      <span class="st"><b>${doneRounds}/${run.clusters.length}</b><span>已跑轮次</span></span>
      <span class="st"><b>${accepted}</b><span>已接纳</span></span>
    </div>
    ${tail}
  </div>`;
}

/* ════════════════════════ 详情页 ════════════════════════ */
function stepperHTML(run){
  const M = run.clusters.length;
  const roundNo = Math.min(Math.max(run.progress - 4 + 1, 1), M);
  const steps = ['筛选输入', `问题聚类（M=${M}）`, 'LLM 归因置信度', '严重程度排序', `迭代优化（第 ${roundNo}/${M} 轮）`, '测试集终评'];
  return `<div class="stepper">` + steps.map((s, i) => {
    const st = unitDone(run, i) ? 'done' : (unitActive(run, i) ? 'active' : '');
    const ico = st === 'done' ? '✓' : (st === 'active' ? '<span class="pulse" style="width:8px;height:8px"></span>' : i + 1);
    return `${i ? `<div class="conn ${unitDone(run, i - 1) ? 'done' : ''}"></div>` : ''}<div class="step ${st}"><span class="ico">${ico}</span><span class="lbl">${esc(s)}</span></div>`;
  }).join('') + `</div>`;
}
// stepper 的 6 个阶段映射到 progress 单元：0,1,2,3 一一对应；阶段4=全部 M 轮；阶段5=终评
function unitDone(run, stage){
  if (stage === 4) return run.progress >= 4 + run.clusters.length;
  if (stage === 5) return isDone(run);
  return run.progress > stage;
}
function unitActive(run, stage){
  if (stage === 4) return run.progress >= 4 && run.progress < 4 + run.clusters.length;
  if (stage === 5) return run.progress === 4 + run.clusters.length && !isDone(run);
  return run.progress === stage;
}

  const key = run.id + ':' + c.id;

  if (done) stateBadge = c.accepted ? `<span class="badge accepted">已接纳 ${fmtDelta(c.eval.cand - c.eval.cur)}</span>` : `<span class="badge rejected">未接纳 ${fmtDelta(c.eval.cand - c.eval.cur)}</span>`;
  else if (active) stateBadge = `<span class="badge running"><span class="pulse"></span>第 ${i + 1} 轮 · 评测中</span>`;
  else stateBadge = `<span class="badge pending">待执行</span>`;
  let body = '';
  if (open) {
    body = `<div class="cluster-body">
      <div class="cb-sec"><div class="cb-label">来源问题报告（${c.reportIds.length} 份 · 由归因结论聚类而来，同类问题才聚为一簇）</div>

      <div class="cb-sec"><div class="cb-label">LLM 归因（拉取 ${esc(run.target.name)}@${run.target.version} 源码判定问题是否真实存在）</div>
        <div class="attr-line">判定：<b>问题真实存在</b> · 置信度 <b class="mono">${confPct(c.conf)}</b> · 严重程度 <b class="mono">${c.sev.toFixed(1)}</b>/10（置信度 × 影响面 × 报告频次综合）</div></div>
      ${done || active ? `<div class="cb-sec"><div class="cb-label">生成的 edit patch（current → candidate）</div>${diffHTML(c.patch)}</div>` : ''}
      ${done ? `<div class="cb-sec"><div class="cb-label">评测对比（验证集）</div>${evalHTML(c.eval, c.accepted)}</div>
        <div class="cb-sec">${c.accepted ? `<div class="cb-label">已接纳 · commit 携带聚类 / 来源报告 / 问题现象</div>${commitHTML(run, c)}` : `<div class="reject-note">未接纳：candidate 评测无收益，current skill 保持 ${c.eval.cur.toFixed(1)}，进入下一轮。</div>`}</div>` : ''}
      ${active ? `<div class="waiting"><span class="pulse"></span> 正在评测 candidate skill…（点右上角「模拟推进一轮」查看结果）</div>` : ''}
      ${!done && !active ? `<div class="waiting">等待前面 ${i} 轮迭代完成后执行</div>` : ''}
    </div>`;
  }
  return `<div class="cluster ${open ? 'open' : ''}">
    <div class="cluster-head" data-action="toggle-cluster" data-key="${key}">
      <span class="rank">#${i + 1}</span>
      <span class="ctitle">${esc(c.title)}</span>
      ${typeChip(c.type)}
      <span class="meta">报告 ×${c.reportIds.length}</span>
      <span class="meta">置信度 ${confPct(c.conf)}</span>
      ${sevHTML(c.sev)}
      <span class="tail">${stateBadge}<span class="caret">▶</span></span>
    </div>
    ${body}
  </div>`;
}

function finalPanel(run){
  if (!isDone(run)) {
    return `<div class="card panel"><div class="sec-title">最终结果</div><div class="waiting">等待 ${run.clusters.length} 轮迭代全部完成后，在测试集上评测 best skill 与初始 skill。</div></div>`;
  }
  const f = run.final;
  const acceptedClusters = run.clusters.filter(c => c.accepted);
  return `<div class="card panel">
    <div class="sec-title">最终结果 <span class="sub">M 轮迭代完成后的测试集终评</span></div>
    <div class="verdict ${f.verdict ? 'ok' : 'no'}">
      <span class="big">${f.verdict ? '✓ 自进化有效' : '✗ 未产生收益'}</span>
      <span class="desc">best skill <b class="mono">${esc(f.bestVersion)}</b> 测试集得分 <b class="mono">${f.bestScore.toFixed(1)}</b> vs 初始 ${run.target.version} <b class="mono">${f.initScore.toFixed(1)}</b>（${fmtDelta(f.bestScore - f.initScore)}）</span>
    </div>
    <div class="cb-sec"><div class="cb-label">best skill 相对初始版本的修改点（${acceptedClusters.length} 个已接纳 patch）</div>
      <div class="changes-list">${acceptedClusters.map(c => `<div class="ch"><span class="mono" style="color:var(--green);font-weight:700">${c.commit}</span><span>[${c.id}] ${esc(c.title)}</span>${typeChip(c.type)}<span style="color:var(--text-faint);font-size:11px">来源 ${c.reportIds.length} 份报告</span></div>`).join('')}</div></div>
    <div class="cb-sec"><div class="cb-label">测试集对比（best vs 初始）</div>
      <table class="metrics"><thead><tr><th>指标</th><th>初始 ${run.target.version}</th><th>${esc(f.bestVersion)}</th><th>Δ</th></tr></thead>
      <tbody>${f.metrics.map(m => `<tr><td>${esc(m.name)}</td><td class="num">${m.init}</td><td class="num">${m.best}</td><td>${fmtDelta(m.delta, m.unit)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function renderDetail(id){
  const run = RUNS.find(r => r.id === id);
  if (!run) { location.hash = '#/runs'; return; }
  if (![...expanded].some(k => k.startsWith(id + ':'))) {
    const ai = run.clusters.findIndex((c, i) => roundActive(run, i));
    expanded.add(id + ':' + run.clusters[ai >= 0 ? ai : 0].id);
  }
  $app.innerHTML = `<div class="wrap">
    <a class="back" href="#/runs">← 返回自进化列表</a>
    <div class="detail-head">
      <h1>${esc(run.title)}</h1>
      ${statusBadge(run)}
      <span class="spacer"></span>
      ${!isDone(run) ? `<button class="btn primary" data-action="advance" data-id="${run.id}">▶ 模拟推进一轮</button>` : ''}
    </div>
    ${infoPanel(run)}
    <div class="card panel"><div class="sec-title">流程进度</div>${stepperHTML(run)}</div>
    <div class="card panel">
      <div class="sec-title">聚类问题与迭代 <span class="sub">按严重程度降序逐轮执行 · 每轮生成 patch → 评测 → 接纳 / 拒绝</span></div>
      ${run.clusters.map((c, i) => clusterHTML(run, c, i)).join('')}
    </div>
    ${finalPanel(run)}
  </div>`;
  window.scrollTo(0, 0);
}

/* ════════════════════════ 仅聚类结果页 ════════════════════════ */
function renderClusterOnly(){
  const d = clusterOnlyData;
  if (!d) { location.hash = '#/runs'; return; }
  $app.innerHTML = `<div class="wrap">
    <a class="back" href="#/runs">← 返回自进化列表</a>
    <div class="detail-head"><h1>问题聚类结果</h1><span class="chip kind">${d.sel.kind}:${esc(d.sel.name)}@${d.sel.version}</span></div>
    <div class="banner">仅聚类分析：展示该对象在所选条件下识别出的问题，<b>未执行</b> patch 生成与评测迭代。<span class="spacer"></span><button class="btn primary" data-action="launch-from-cluster">以这批问题启动自进化 →</button></div>
    <div class="card panel">
      <div class="sec-title">输入概况</div>
      <div class="run-stats">
        <span class="st"><b>${d.sessions}</b><span>session</span></span>
        <span class="st"><b>${d.reports}</b><span>问题报告</span></span>
        <span class="st"><b>${d.used}</b><span>是问题（用于聚类）</span></span>
        <span class="st"><b>${d.clusters.length}</b><span>聚类数 M</span></span>
      </div>
      <div style="margin-top:8px;font-size:11.5px;color:var(--text-faint)">时间段 ${d.sel.from} ~ ${d.sel.to} · 模型 ${d.sel.models.join(' / ') || '全部'}</div>
    </div>
    <div class="card panel">
      <div class="sec-title">聚类出的 ${d.clusters.length} 类问题 <span class="sub">按严重程度降序 · 同类问题才聚为一簇</span></div>
      ${d.clusters.map((c, i) => `<div class="cluster ${expanded.has('co:' + i) ? 'open' : ''}">
        <div class="cluster-head" data-action="toggle-cluster" data-key="co:${i}">
          <span class="rank">#${i + 1}</span><span class="ctitle">${esc(c.title)}</span>${typeChip(c.type)}
          <span class="meta">报告 ×${c.reportIds.length}</span><span class="meta">置信度 ${confPct(c.conf)}</span>${sevHTML(c.sev)}
          <span class="tail"><span class="caret">▶</span></span>
        </div>
        <div class="cluster-body">
          <div class="cb-sec"><div class="cb-label">来源问题报告（${c.reportIds.length} 份）</div>
            <div class="report-chips">${c.reportIds.map(r => `<span class="report-chip">${r}</span>`).join('')}</div></div>
          <div class="cb-sec"><div class="cb-label">问题现象</div><div class="attr-line">${esc(c.phenomenon)}</div></div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ════════════════════════ 启动向导 ════════════════════════ */
const OBJECTS = {
  skill: ['deep-research', 'code-review', 'web-search'],
  agent: ['general-purpose', 'Explore', 'workflow'],
};
const VERSIONS = {
  'deep-research': ['v2.0.0', 'v1.9.0', 'v1.8.2'],
  'code-review': ['v1.4.0', 'v1.3.1'],
  'web-search': ['v0.9.3'],
  'general-purpose': ['v1.2.0', 'v1.1.0'],
  'Explore': ['v1.0.1', 'v1.0.0'],
  'workflow': ['v0.8.0'],
};
const MODELS = ['claude-sonnet-4.5', 'gpt-5', 'deepseek-v3.2', 'kimi-k2'];
const PHENOMENA = ['检索结果反序列化失败', '输出缺少来源引用', '长文档分块上下文丢失', '报告导出结构损坏', '研究计划过度拆分', '重复加载同一文档', '会话快照读取越界', '分析范围越界'];

let wz = null;
function openWizard(){
  wz = { step: 1, kind: 'skill', name: 'deep-research', version: 'v2.0.0', from: '2026-10-01', to: '2026-10-19', models: new Set(MODELS.slice(0, 3)), queried: false };
  renderWizard();
}
function wzMatch(){
  const h = hashStr([wz.kind, wz.name, wz.version, wz.from, wz.to, [...wz.models].sort().join(',')].join('|'));
  const sessions = 40 + h % 120;
  const reports = 12 + (h >> 3) % 40;
  const analyzed = Math.round(reports * (0.7 + (h % 20) / 100));
  const notProblem = Math.round(analyzed * 0.25);
  const used = analyzed - notProblem;
  return { sessions, reports, analyzed, unanalyzed: reports - analyzed, notProblem, used };
}
function wzReports(){
  const m = wzMatch();
  const h0 = hashStr(wz.name + wz.version);
  const rows = [];
  for (let i = 0; i < Math.min(8, m.reports); i++) {
    const h = (h0 * 31 + i * 17) >>> 0;
    const analyzed = i < Math.round(8 * m.analyzed / m.reports);
    rows.push({
      id: 'R-' + (1000 + h % 900),
      ph: PHENOMENA[h % PHENOMENA.length],
      model: MODELS[h % MODELS.length],
      type: analyzed ? ['非问题', '是问题-错误', '是问题-prompt缺失某些提示词', '是问题-模型问题'][h % 4] : '未分析',
    });
  }
  return rows;
}
function renderWizard(){
  const names = OBJECTS[wz.kind];
  const vers = VERSIONS[wz.name] || ['v1.0.0'];
  if (!names.includes(wz.name)) wz.name = names[0];
  if (!vers.includes(wz.version)) wz.version = vers[0];
  const m = wz.queried ? wzMatch() : null;
  $modal.innerHTML = `<div class="overlay" data-action="close-wizard-bg">
    <div class="modal">
      <div class="modal-head"><h2>启动自进化</h2><button class="x" data-action="close-wizard">✕</button></div>
      <div class="modal-body">
        <div class="wz-steps"><span class="${wz.step === 1 ? 'on' : ''}">① 筛选问题报告</span> → <span class="${wz.step === 2 ? 'on' : ''}">② 确认输入并启动</span></div>
        <div class="f-row"><div class="f-label">进化对象 <span class="req">*</span></div>
          <div class="f-inline">
            <div class="seg">
              <button class="${wz.kind === 'skill' ? 'active' : ''}" data-action="wz-kind" data-v="skill">skill</button>
              <button class="${wz.kind === 'agent' ? 'active' : ''}" data-action="wz-kind" data-v="agent">agent</button>
            </div>
            <select class="inp" id="wz-name">${names.map(n => `<option ${n === wz.name ? 'selected' : ''}>${n}</option>`).join('')}</select>
            <span style="color:var(--text-faint);font-size:12px">版本</span>
            <select class="inp" id="wz-version">${vers.map(v => `<option ${v === wz.version ? 'selected' : ''}>${v}</option>`).join('')}</select>
          </div>
        </div>
        <div class="f-row"><div class="f-label">时间段（session 启动时间） <span class="req">*</span></div>
          <div class="f-inline"><input class="inp" type="date" id="wz-from" value="${wz.from}"> <span style="color:var(--text-faint)">~</span> <input class="inp" type="date" id="wz-to" value="${wz.to}"></div>
        </div>
        <div class="f-row"><div class="f-label">模型（多选，只纳入这些模型跑出的报告）</div>
          <div class="pick">${MODELS.map(x => `<span class="opt ${wz.models.has(x) ? 'on' : ''}" data-action="wz-model" data-v="${x}">${x}</span>`).join('')}</div>
        </div>
        <div class="f-row"><button class="btn" data-action="wz-query">查询匹配报告</button></div>
        ${m ? `<div class="match-summary">
          命中 session <b>${m.sessions}</b> 个 · 问题报告 <b>${m.reports}</b> 份（已分析 <b>${m.analyzed}</b> / 未分析 <b>${m.unanalyzed}</b>）· 其中「是问题」<b>${m.used}</b> 份将作为进化输入
          <table class="rep"><thead><tr><th>报告 ID</th><th>问题现象</th><th>模型</th><th>归因</th></tr></thead>
          <tbody>${wzReports().map(r => `<tr><td class="id">${r.id}</td><td>${esc(r.ph)}</td><td class="mono" style="color:var(--cyan)">${r.model}</td><td>${r.type === '未分析' ? '<span style="color:var(--text-faint)">未分析</span>' : typeChip(r.type)}</td></tr>`).join('')}</tbody></table>
          <div style="margin-top:6px;font-size:11px;color:var(--text-faint)">预览前 8 份 · 未分析的报告会先补归因再进入聚类</div>
        </div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" data-action="wz-cluster" ${m ? '' : 'disabled'}>仅聚类分析</button>
        <button class="btn primary" data-action="wz-start" ${m ? '' : 'disabled'}>启动自进化 →</button>
      </div>
    </div>
  </div>`;
}
function wzSelection(){ return { kind: wz.kind, name: wz.name, version: wz.version, from: wz.from, to: wz.to, models: [...wz.models] }; }

function templateClusters(kind){
  // 打桩：按对象类型复用预置聚类
  const src = kind === 'agent' ? RUNS[2].clusters : RUNS[0].clusters;
  return src.map(c => ({ ...c, reportIds: reportIds('new' + c.id + c.title, c.reportIds.length) }));
}
function buildClusterOnly(){
  const sel = wzSelection();
  const m = wzMatch();
  clusterOnlyData = { sel, sessions: m.sessions, reports: m.reports, used: m.used, clusters: templateClusters(sel.kind) };
  lastSelection = sel;
}
function startRun(){
  const sel = lastSelection = wzSelection();
  const m = wzMatch();
  const id = 'evo-new-' + Date.now().toString(36);
  const nErr = Math.round(m.used * 0.5), nPrompt = Math.min(Math.round(m.used * 0.3), m.used - nErr);
  const run = {
    id, title: `${sel.name} ${sel.version} 自进化`,
    target: { kind: sel.kind, name: sel.name, version: sel.version },
    window: [sel.from, sel.to], models: sel.models.length ? sel.models : MODELS,
    createdAt: '2026-10-19 19:05',
    stats: { sessions: m.sessions, reports: m.reports, analyzed: m.analyzed, unanalyzed: m.unanalyzed,
      byType: { '非问题': m.notProblem, '是问题-错误': nErr, '是问题-prompt缺失某些提示词': nPrompt, '是问题-模型问题': m.used - nErr - nPrompt }, used: m.used },
    progress: 1,
    clusters: templateClusters(sel.kind),
    final: JSON.parse(JSON.stringify(RUNS[0].final)),
  };
  run.final.bestVersion = sel.version + '-best';
  RUNS.unshift(run);
  return run;
}

/* ════════════════════════ 事件 ════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'open-run') { expanded.clear(); location.hash = '#/run/' + el.dataset.id; }
  else if (a === 'toggle-cluster') { const k = el.dataset.key; expanded.has(k) ? expanded.delete(k) : expanded.add(k); route(); }
  else if (a === 'advance') {
    const run = RUNS.find(r => r.id === el.dataset.id);
    if (run && !isDone(run)) { run.progress++; expanded.clear(); renderDetail(run.id); }
  }
  else if (a === 'launch') openWizard();
  else if (a === 'close-wizard') { $modal.innerHTML = ''; }
  else if (a === 'close-wizard-bg') { if (e.target === el) $modal.innerHTML = ''; }
  else if (a === 'wz-kind') { wz.kind = el.dataset.v; wz.name = OBJECTS[wz.kind][0]; wz.version = VERSIONS[wz.name][0]; wz.queried = false; renderWizard(); }
  else if (a === 'wz-model') { const v = el.dataset.v; wz.models.has(v) ? wz.models.delete(v) : wz.models.add(v); wz.queried = false; renderWizard(); }
  else if (a === 'wz-query') { syncWzInputs(); wz.queried = true; wz.step = 2; renderWizard(); }
  else if (a === 'wz-cluster') { syncWzInputs(); buildClusterOnly(); $modal.innerHTML = ''; expanded.clear(); location.hash = '#/cluster'; }
  else if (a === 'wz-start') { syncWzInputs(); const run = startRun(); $modal.innerHTML = ''; expanded.clear(); location.hash = '#/run/' + run.id; }
  else if (a === 'launch-from-cluster') {
    // 从仅聚类结果直接启动：复用当前选择
    if (clusterOnlyData) {
      wz = { kind: clusterOnlyData.sel.kind, name: clusterOnlyData.sel.name, version: clusterOnlyData.sel.version, from: clusterOnlyData.sel.from, to: clusterOnlyData.sel.to, models: new Set(clusterOnlyData.sel.models), queried: true };
      const run = startRun(); expanded.clear(); location.hash = '#/run/' + run.id;
    }
  }
});
document.addEventListener('change', e => {
  if (!wz) return;
  if (e.target.id === 'wz-name') { wz.name = e.target.value; wz.version = (VERSIONS[wz.name] || ['v1.0.0'])[0]; wz.queried = false; renderWizard(); }
  else if (e.target.id === 'wz-version') { wz.version = e.target.value; wz.queried = false; }
  else if (e.target.id === 'wz-from') { wz.from = e.target.value; wz.queried = false; }
  else if (e.target.id === 'wz-to') { wz.to = e.target.value; wz.queried = false; }
});
function syncWzInputs(){
  const g = id => document.getElementById(id);
  if (g('wz-name')) wz.name = g('wz-name').value;
  if (g('wz-version')) wz.version = g('wz-version').value;
  if (g('wz-from')) wz.from = g('wz-from').value;
  if (g('wz-to')) wz.to = g('wz-to').value;
}

route();
</script>
</body>
</html>
