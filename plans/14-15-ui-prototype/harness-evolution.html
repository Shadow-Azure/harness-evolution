reports: ${c.reportIds.map(id => { const r = REPORT_BY_ID[id]; return r ? reportIdLink(r) : id; }).join(', ')}
phenomenon: ${esc(c.phenomenon)}</div>
  </div>`;
}

function clusterHTML(run, c, i){
  const key = run.id + ':' + c.id;
  const open = expanded.has(key);
  const done = roundDone(run, i), active = roundActive(run, i);
  let stateBadge;
  if (done) stateBadge = c.accepted ? `<span class="badge accepted">已接纳 ${fmtDelta(c.eval.cand - c.eval.cur)}</span>` : `<span class="badge rejected">未接纳 ${fmtDelta(c.eval.cand - c.eval.cur)}</span>`;
  else if (active) stateBadge = `<span class="badge running"><span class="pulse"></span>第 ${i + 1} 轮 · 评测中</span>`;
  else stateBadge = `<span class="badge pending">待执行</span>`;
  let body = '';
  if (open) {
    body = `<div class="cluster-body">
      <div class="cb-sec"><div class="cb-label">来源问题报告（${c.reportIds.length} 份 · 由归因结论聚类而来，同类问题才聚为一簇 · 报告 ID 点击新窗口打开归因分析，问题 ID 打开问题描述）</div>
        ${reportTableHTML(c)}</div>
      <div class="cb-sec"><div class="cb-label">LLM 归因（拉取 ${esc(run.target.name)}@${run.target.version} 源码判定问题是否真实存在）</div>
        <div class="attr-line">判定：<b>问题真实存在</b> · 置信度 <b class="mono">${confPct(c.conf)}</b> · 严重程度 <b class="mono">${c.sev.toFixed(1)}</b>/10（置信度 × 影响面 × 报告频次综合）</div></div>
      ${done || active ? `<div class="cb-sec"><div class="cb-label">生成的 edit patch（current → candidate）</div>${diffHTML(c.patch)}</div>` : ''}
      ${done ? `<div class="cb-sec"><div class="cb-label">评测对比（验证集）</div>${evalHTML(c.eval, c.accepted)}</div>
        <div class="cb-sec">${c.accepted ? `<div class="cb-label">已接纳 · commit 携带聚类 / 来源报告 / 问题现象</div>${commitHTML(run, c)}` : `<div class="reject-note">未接纳：candidate 评测无收益，current skill 保持 ${c.eval.cur.toFixed(1)}，进入下一轮。</div>`}</div>` : ''}
      ${active ? `<div class="waiting"><span class="pulse"></span> 正在评测 candidate skill…（点右上角「模拟推进一轮」查看结果）</div>` : ''}
      ${!done && !active ? `<div class="waiting">等待前面 ${i} 轮迭代完成后执行</div>` : ''}
    </div>`;
  }
  return `<div class="cluster ${open ? 'open' : ''}">
    <div class="cluster-head" data-action="toggle-cluster" data-key="${key}">
      <span class="rank">#${i + 1}</span>
      <span class="ctitle">${esc(c.title)}</span>
      ${typeChip(c.type)}
      <span class="meta">报告 ×${c.reportIds.length}</span>
      <span class="meta">置信度 ${confPct(c.conf)}</span>
      ${sevHTML(c.sev)}

  // 打桩：按对象类型复用预置聚类（连带其真实关联的报告，保证新 run 的报告同样可溯源跳转）
  const src = (kind === 'agent'
    ? RUNS.find(r => r.id === 'evo-20261006-03')
    : RUNS.find(r => r.id === 'evo-20261019-01')).clusters;
  return src.map(c => ({ ...c, reportIds: [...c.reportIds], reports: (c.reports || []).map(r => ({ ...r })) }));
}
function buildClusterOnly(){
  const sel = wzSelection();
  const m = wzMatch();
  clusterOnlyData = { sel, sessions: m.sessions, reports: m.reports, used: m.used, clusters: templateClusters(sel.kind) };
  lastSelection = sel;
}
function startRun(){
  const sel = lastSelection = wzSelection();
  const m = wzMatch();
  const id = 'evo-new-' + Date.now().toString(36);
  const nErr = Math.round(m.used * 0.5), nPrompt = Math.min(Math.round(m.used * 0.3), m.used - nErr);
  const run = {
    id, title: `${sel.name} ${sel.version} 自进化`,
    target: { kind: sel.kind, name: sel.name, version: sel.version },
    window: [sel.from, sel.to], models: sel.models.length ? sel.models : MODELS,
    createdAt: '2026-10-19 19:05',
    stats: { sessions: m.sessions, reports: m.reports, analyzed: m.analyzed, unanalyzed: m.unanalyzed,
      byType: { '非问题': m.notProblem, '是问题-错误': nErr, '是问题-prompt缺失某些提示词': nPrompt, '是问题-模型问题': m.used - nErr - nPrompt }, used: m.used },
    progress: 1,
    clusters: templateClusters(sel.kind),
    final: JSON.parse(JSON.stringify(RUNS[0].final)),
  };
  run.final.bestVersion = sel.version + '-best';
  RUNS.unshift(run);
  return run;
}

/* ════════════════════════ 事件 ════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'open-run') { expanded.clear(); lastDetailId = null; location.hash = '#/run/' + el.dataset.id; }
  else if (a === 'toggle-cluster') { const k = el.dataset.key; expanded.has(k) ? expanded.delete(k) : expanded.add(k); route(); }
  else if (a === 'sel-step') { selStep = +el.dataset.step; route(); }
  else if (a === 'advance') {
    const run = RUNS.find(r => r.id === el.dataset.id);
    if (run && !isDone(run)) { run.progress++; expanded.clear(); selStep = null; renderDetail(run.id); }
  }
  else if (a === 'launch') openWizard();
  else if (a === 'close-wizard') { $modal.innerHTML = ''; }
  else if (a === 'close-wizard-bg') { if (e.target === el) $modal.innerHTML = ''; }
  else if (a === 'wz-kind') { wz.kind = el.dataset.v; wz.name = OBJECTS[wz.kind][0]; wz.version = VERSIONS[wz.name][0]; wz.queried = false; renderWizard(); }
  else if (a === 'wz-model') { const v = el.dataset.v; wz.models.has(v) ? wz.models.delete(v) : wz.models.add(v); wz.queried = false; renderWizard(); }
  else if (a === 'wz-query') { syncWzInputs(); wz.queried = true; wz.step = 2; wz.page = 1; renderWizard(); }
  else if (a === 'wz-back') { wz.step = 1; renderWizard(); }
  else if (a === 'wz-prev') { wz.page = Math.max(1, (wz.page || 1) - 1); renderWizard(); }
  else if (a === 'wz-next') { wz.page = (wz.page || 1) + 1; renderWizard(); }
  else if (a === 'wz-cluster') { syncWzInputs(); buildClusterOnly(); $modal.innerHTML = ''; expanded.clear(); location.hash = '#/cluster'; }
  else if (a === 'wz-start') { syncWzInputs(); const run = startRun(); $modal.innerHTML = ''; expanded.clear(); location.hash = '#/run/' + run.id; }
  else if (a === 'launch-from-cluster') {
    // 从仅聚类结果直接启动：复用当前选择
    if (clusterOnlyData) {
      wz = { kind: clusterOnlyData.sel.kind, name: clusterOnlyData.sel.name, version: clusterOnlyData.sel.version, from: clusterOnlyData.sel.from, to: clusterOnlyData.sel.to, models: new Set(clusterOnlyData.sel.models), queried: true };
      const run = startRun(); expanded.clear(); location.hash = '#/run/' + run.id;
    }
  }
});
document.addEventListener('change', e => {
  if (!wz) return;
  if (e.target.id === 'wz-name') { wz.name = e.target.value; wz.version = (VERSIONS[wz.name] || ['v1.0.0'])[0]; wz.queried = false; renderWizard(); }
  else if (e.target.id === 'wz-version') { wz.version = e.target.value; wz.queried = false; }
  else if (e.target.id === 'wz-from') { wz.from = e.target.value; wz.queried = false; }
  else if (e.target.id === 'wz-to') { wz.to = e.target.value; wz.queried = false; }
});
function syncWzInputs(){
  const g = id => document.getElementById(id);
  if (g('wz-name')) wz.name = g('wz-name').value;
  if (g('wz-version')) wz.version = g('wz-version').value;
  if (g('wz-from')) wz.from = g('wz-from').value;
  if (g('wz-to')) wz.to = g('wz-to').value;
}

route();
</script>
