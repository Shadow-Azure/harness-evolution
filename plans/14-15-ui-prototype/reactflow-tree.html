  .hint { font-size: 11px; color: var(--faint); }
  .canvas { flex: 1; position: relative; min-height: 0; }

  .rf-label { font-size: 11px; color: var(--dim); white-space: nowrap; margin-bottom: 4px; background: #fff; }
  .rf-bar { position: relative; height: 18px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--blue) 45%, transparent); background: color-mix(in srgb, var(--blue) 16%, #fff); }
  .rf-agent.sub .rf-bar { border-color: color-mix(in srgb, var(--purple) 40%, transparent); background: color-mix(in srgb, var(--purple) 10%, #fff); }
  .rf-agent.wf .rf-bar { border-color: color-mix(in srgb, var(--orange) 40%, transparent); background: color-mix(in srgb, var(--orange) 12%, #fff); }
  .rf-agent.group { border: 1px dashed var(--faint); border-radius: 8px; padding: 8px 10px; text-align: center; font-size: 11px; color: var(--dim); cursor: pointer; background: var(--panel); }
  .rf-mark { position: absolute; top: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%) rotate(45deg); border-radius: 1px; }
  .rf-mark.skill { background: var(--cyan); }
  .rf-mark.agent, .rf-mark.workflow { background: var(--purple); }
  .rf-lines { font-size: 10px; color: var(--faint); margin-top: 2px; }
  .rf-skill-wrap { display: flex; justify-content: flex-end; }
  .rf-skill { display: inline-flex; align-items: center; gap: 5px; width: 100%; box-sizing: border-box; font-size: 10.5px; color: var(--cyan); background: #fff; border: 1px dashed color-mix(in srgb, var(--cyan) 55%, transparent); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }

}
function skillPillW(name) {
  const font = '10.5px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

const NODE_W = (lines, maxLines) => Math.max(120, Math.min(560, Math.round((lines || 0) / maxLines * 540)));

function buildGraph(sid, expanded) {
  const d = TREE[sid];
  const flat = [];
  (function walk(list) { list.forEach(n => { flat.push(n); walk(n.children || []); }); })(d.subs);
  const maxLines = Math.max(d.main.lines, ...flat.map(n => n.lines || 0), 1);
  const wOf = l => NODE_W(l, maxLines);
  const nodes = [], edges = [];
  const rootW = wOf(d.main.lines);
  nodes.push({
    id: "main", type: "agent",
    position: { x: 60, y: 40 },
    data: { label: "主会话", kind: "main", w: rootW, lines: d.main.lines,
            marks: marksOf(d.main.events, d.main.lines) },
  });
  const skillNodes = [];
  let cursorY = 40 + 130;

  const INDENT = 46, MIN_STEP = 38;

  function marksOf(events, lines) {
    return (events || []).map((e, i) => ({
      id: i, kind: e.kind, line: e.line,
      pct: Math.min(0.98, (e.line || 0) / Math.max(lines, 1)),
      title: `L${e.line} · ${e.kind === "skill" ? e.name : (e.desc || e.name || "")}`,
    }));
  }

  function childEventIndex(parentEvents, child) {
    if (!parentEvents) return -1;
    if (child.toolUseId) {
      const i = parentEvents.findIndex(e => e.toolUseId === child.toolUseId);
      if (i >= 0) return i;
    }
    return parentEvents.findIndex(e => e.kind === "workflow");
  }

  function addSkillNodes(nodeId, nodeX, nodeY, nodeW, events, lines) {
    let k = 0;  // 同一节点上的多个 skill 竖向堆叠，避免互相压住
    (events || []).forEach((e, i) => {
      if (e.kind !== "skill") return;
      const name = e.name || "skill";
      const pw = skillPillW(name);  // 实测宽度，药丸填满不留白
      const px = nodeX - pw - 14;   // 右缘在会话条左侧 14px
      const sid = `${nodeId}-skill-${i}`;
      nodes.push({
        id: sid, type: "skill",
        position: { x: px, y: nodeY + 50 + k * 66 },
        data: { name, line: e.line, w: pw },
      });
      skillNodes.push({ sid, agent: nodeId, name, x: px, y: nodeY + 50 + k * 66, w: pw });
      k += 1;
      edges.push({
        id: `e-${nodeId}-skill-${i}`,
        source: nodeId, sourceHandle: "h" + i,
        target: sid, targetHandle: "in",
        type: "skilledge",
        style: { stroke: "#158a8a", strokeWidth: 1.2, strokeDasharray: "4 3" },
      });
    });
  }

  function rowX(trigger) {
    const x = Math.max(lastX + MIN_STEP, 40 + row * INDENT, trigger + 14);
    lastX = x;
    return x;
  }

  function place(parentNode, parentData, children) {
    if (!children || !children.length) return;
    // 按触发日志行号排序：子节点自身没有 line，需要用 toolUseId 回查父节点事件
    const lineOf = (c) => {
      if (c.line != null) return c.line;
      if (c.toolUseId && parentData.events) {
        const e = parentData.events.find(x => x.toolUseId === c.toolUseId);
        if (e) return e.line;
      }
      return Number.MAX_SAFE_INTEGER;
    };
    const sorted = children
      .map((c, i) => ({ c, i, k: lineOf(c) }))
      .sort((x, y) => (x.k - y.k) || (x.i - y.i))
      .map(x => x.c);
    const tooMany = sorted.length > 8 && !expanded[parentNode];
    if (tooMany) {
      const gid = parentNode + "-group";
      const gi = Math.max(childEventIndex(parentData.events, sorted[0]), 0);
      const x = rowX(parentData.x + ((parentData.events?.[gi]?.line ?? 0) / Math.max(parentData.lines, 1)) * parentData.w);
      nodes.push({
        id: gid, type: "collapse",
        position: { x, y: cursorY },
        data: { label: `${sorted.length} 个子 agent · 点击展开`, parent: parentNode },
      });
      edges.push({
        id: `e-${parentNode}-${gid}`,
        source: parentNode, sourceHandle: "h" + gi,
        target: gid, targetHandle: "in",
        type: "orth", data: { idx: 0 }, style: { stroke: "#c4cbd6", strokeWidth: 1.4 },
        markerEnd: { type: MarkerType.ArrowClosed, color: "#c4cbd6", width: 12, height: 12 },
      });
      cursorY += 104; row += 1;
      return;
    }
    sorted.forEach((c, idx) => {
      c.__idx = idx;
      const evIdx = childEventIndex(parentData.events, c);
      const pct = evIdx >= 0 ? Math.min(0.98, (parentData.events[evIdx].line || 0) / Math.max(parentData.lines, 1)) : 0.45;
      const triggerX = parentData.x + pct * parentData.w;
      const x = rowX(triggerX);
      const w = wOf(c.lines);
      const nodeMarks = (c.type === "workflow" && (!c.events || !c.events.length))
        ? [{ id: 0, kind: "workflow", pct: 0.5, title: "workflow run" }]
        : marksOf(c.events, c.lines || 0);
      nodes.push({
        id: c.id, type: "agent",
        position: { x, y: cursorY },
        data: {
          label: `${c.type}${c.desc ? " · " + c.desc : ""}${evIdx >= 0 ? " · L" + parentData.events[evIdx].line : ""}`,
          kind: c.type === "workflow" ? "wf" : "sub",
          w, lines: c.lines || 0,
          marks: nodeMarks,
          events: c.events,
        },
      });
      edges.push({
        id: `e-${parentNode}-${c.id}`,
        source: parentNode, sourceHandle: "h" + Math.max(evIdx, 0),
        target: c.id, targetHandle: "in",
        type: "orth", data: { idx: (c.__idx ?? 0) }, style: { stroke: "#c4cbd6", strokeWidth: 1.4 },
      });
      addSkillNodes(c.id, x, cursorY, w, c.events, c.lines || 0);
      cursorY += 118; row += 1;
      place(c.id, { x, w, events: c.events, lines: c.lines || 0 }, c.children || []);
    });
  }

  // 主会话的 marks 需要带 events 供子节点查找
  addSkillNodes("main", 60, 40, rootW, d.main.events, d.main.lines);
  const mainData = { x: 60, w: rootW, events: d.main.events, lines: d.main.lines };
  place("main", mainData, d.subs);

  // ── 问题打桩：skill 的问题放左侧堆叠，subagent 的问题放右侧堆叠 ──
  const RED = "#d63c3c";
  const textW = (s) => [...s].reduce((a, ch) => a + (/[\u2e80-\uffff]/.test(ch) ? 10.8 : 6.3), 0);
  const BOX_H = 22, GAP = 6;
  let fn = 1;

  function addFindings(targetId, anchorX, centerY, side, texts) {
    const n = texts.length;
    const totalH = n * BOX_H + (n - 1) * GAP;
    const startY = centerY - totalH / 2;
    texts.forEach((text, i) => {
      const w = Math.max(150, Math.min(340, 26 + textW(text)));
      const y = startY + i * (BOX_H + GAP);
      const x = side === "left" ? anchorX - w - 46 : anchorX + 46;
      const fid = `find-${targetId}-${i}`;
      nodes.push({ id: fid, type: "finding", position: { x, y }, data: { text, w } });
      edges.push({
        id: "ef-" + fid,
        source: side === "left" ? fid : targetId,
        sourceHandle: side === "left" ? "out" : "findout",
        target: side === "left" ? targetId : fid,
        targetHandle: side === "left" ? "in-left" : "in",
        type: "findedge",
        style: { stroke: RED, strokeWidth: 1.3, strokeDasharray: "4 3" },
      });
    });
  }

  // 每个 skill：2 条问题，堆在药丸左侧
  skillNodes.forEach((s) => {
    const texts = [
      `#${fn++} skill出现问题：重复加载，未命中缓存`,
      `#${fn++} skill出现问题：输出未校验来源`,
    ];
    addFindings(s.sid, s.x, s.y + 9, "left", texts);
  });

  // ── 上报型问题（类型 3/4）：挂在触发点右上方，先触发的在上 ──
  function addReported(parentId, parentX, parentY, parentW, marks) {
    const trig = (marks || [])
      .filter(m => m.kind === "skill" || m.kind === "agent" || m.kind === "workflow")
      .sort((a, b) => (a.line || 0) - (b.line || 0))
      .slice(0, 4);
    if (!trig.length) return;
    const barTop = parentY + 16;
    trig.forEach((m, i) => {
      const skillTexts = ["此前步骤的检索结果缺少来源校验", "此前步骤的检索范围不足"];
      const agentTexts = ["此前步骤遗漏了 MCP 调用失败的重试", "此前步骤未汇总其他子 agent 的结论"];
      const text = m.kind === "skill"
        ? `#${fn++} skill发现前置步骤存在问题：${skillTexts[i % 2]}`
        : `#${fn++} subagent发现前置步骤存在问题：${agentTexts[i % 2]}`;
      const w = Math.max(170, Math.min(440, 26 + textW(text)));
      const x = parentX + parentW + 18;
      const y = barTop - 36 - (trig.length - i) * 28;
      const fid = `rep-${parentId}-${i}`;
      nodes.push({ id: fid, type: "finding", position: { x, y }, data: { text, w } });
      edges.push({
        id: "er-" + fid,
        source: parentId, sourceHandle: "rep" + m.id,
        target: fid, targetHandle: "in",
        type: "reported",
        style: { stroke: RED, strokeWidth: 1.3, strokeDasharray: "4 3" },
      });
    });
  }

  addReported("main", 60, 40, rootW, d.main.events.length ? marksOf(d.main.events, d.main.lines) : []);
  nodes
    .filter(n => n.type === "agent" && n.id !== "main")
    .forEach(n => addReported(n.id, n.position.x, n.position.y,
      Math.max(n.data.w, measureW(n.data.label || "", LABEL_FONT) + 6), n.data.marks || []));

  // 最后一个 subagent：3 条问题，堆在条右侧
  const agentNodes = nodes.filter(n => n.type === "agent");
  const lastAgent = agentNodes[agentNodes.length - 1];
  if (lastAgent) {
    const texts = [
      `#${fn++} subagent出现问题：越界执行，未按任务边界收敛`,
      `#${fn++} subagent出现问题：子任务重复抓取同一页面`,
      `#${fn++} subagent出现问题：未回报中间结果`,
    ];
    addFindings(lastAgent.id, lastAgent.position.x +
      Math.max(lastAgent.data.w, measureW(lastAgent.data.label || "", LABEL_FONT) + 6),
      lastAgent.position.y + 16, "right", texts);
  }  return { nodes, edges };
}

/* ── 自定义节点 ── */
function AgentNode({ data }) {
  const marks = data.marks || [];
  return html`
    <div className=${"rf-agent " + (data.kind || "")} style=${{ width: data.w + "px" }}>
      <div className="rf-label" title=${data.label}>${data.label}</div>
      <div className="rf-bar">
        ${marks.map((m, i) => html`
          <span key=${"mk" + i} className=${"rf-mark " + m.kind}
                style=${{ left: (m.pct * 100) + "%" }} title=${m.title}></span>
        `)}
        ${marks.map((m, i) => html`
          <${Handle} key=${"h" + i} id=${"h" + i} type="source" position=${Position.Bottom}
            style=${{ left: (m.pct * 100) + "%", top: "50%", width: 10, height: 10, opacity: 0, background: "transparent", border: "none" }} />
        `)}
        ${marks.map((m, i) => html`
          <${Handle} key=${"rep" + i} id=${"rep" + i} type="source" position=${Position.Top}
            style=${{ left: (m.pct * 100) + "%", top: 0, width: 10, height: 10, opacity: 0, background: "transparent", border: "none" }} />
        `)}
        <${Handle} type="target" position=${Position.Left} id="in"
          style=${{ top: "50%", width: 10, height: 10, opacity: 0, background: "transparent", border: "none" }} />
        <${Handle} type="source" position=${Position.Right} id="findout"
          style=${{ top: "50%", right: 0, width: 10, height: 10, opacity: 0, background: "transparent", border: "none" }} />
      </div>
      <div className="rf-lines">${data.lines} 行</div>
    </div>`;
}

function GroupNode({ data }) {
  return html`
    <div className="rf-agent group" style=${{ width: "220px" }}>
      <div>${data.label}</div>
      <${Handle} type="target" position=${Position.Left} id="in"
        style=${{ top: "50%", width: 10, height: 10, opacity: 0 }} />
    </div>`;
}



function SkillEdge({ id, sourceX, sourceY, targetX, targetY, style }) {
  const r = Math.min(8, Math.max(0, sourceX - targetX) / 2, Math.max(0, targetY - sourceY) / 2);
  const d = `M ${sourceX} ${sourceY} V ${targetY - r} Q ${sourceX} ${targetY} ${sourceX - r} ${targetY} H ${targetX}`;
  return React.createElement("path", { id, className: "react-flow__edge-path", d, style });
}


function FindingEdge({ id, sourceX, sourceY, targetX, targetY, style }) {
  const trunk = sourceX + 24;
  const dy = targetY - sourceY;
  const s = dy === 0 ? 1 : Math.sign(dy);
  const r = Math.min(7, Math.abs(dy) / 2);
  const d = dy === 0
    ? `M ${sourceX} ${sourceY} H ${targetX}`
    : `M ${sourceX} ${sourceY} H ${trunk - r} Q ${trunk} ${sourceY} ${trunk} ${sourceY + s * r} ` +
      `V ${targetY - s * r} Q ${trunk} ${targetY} ${trunk + r} ${targetY} H ${targetX}`;
  return React.createElement("path", { id, className: "react-flow__edge-path", d, style });
}


function ReportEdge({ id, sourceX, sourceY, targetX, targetY, style }) {
  const r = Math.min(7, Math.abs(targetY - sourceY) / 2);
  const d = `M ${sourceX} ${sourceY} V ${targetY + r} Q ${sourceX} ${targetY} ${sourceX + r} ${targetY} H ${targetX}`;
  return React.createElement("path", { id, className: "react-flow__edge-path", d, style });
}

/* 正交折线：每条边用自己的竖直通道，避免线挤在一起 */
function OrthEdge({ id, sourceX, sourceY, targetX, targetY, data, style, markerEnd }) {
  // 触发点垂直下落到子节点所在行，再水平连到子节点左缘（圆角拐弯）
  const r = Math.min(8, Math.max(0, targetX - sourceX) / 2, Math.max(0, targetY - sourceY) / 2);
  const d = `M ${sourceX} ${sourceY} V ${targetY - r} Q ${sourceX} ${targetY} ${sourceX + r} ${targetY} H ${targetX}`;
  return React.createElement("path", {
    id, className: "react-flow__edge-path", d, style, markerEnd,
  });
}
const edgeTypes = { orth: OrthEdge, skilledge: SkillEdge, findedge: FindingEdge, reported: ReportEdge };


function SkillNode({ data }) {
  return html`
    <div className="rf-skill-wrap" style=${{ width: (data.w || 200) + "px" }}>
      <div className="rf-skill" title=${"L" + data.line + " · " + data.name}>
        <span className="rf-skill-dot"></span><span className="rf-skill-name">${data.name}</span>
      </div>
      <${Handle} type="target" position=${Position.Right} id="in"
        style=${{ top: "50%", right: 0, width: 8, height: 8, opacity: 0 }} />
      <${Handle} type="target" position=${Position.Left} id="in-left"
        style=${{ top: "50%", left: 0, width: 8, height: 8, opacity: 0 }} />
    </div>`;
}


function FindingNode({ data }) {
  return html`
    <div className="rf-finding" style=${{ width: (data.w || 200) + "px" }} title=${data.text}>
      ${data.text}
      <${Handle} type="target" position=${Position.Left} id="in"
        style=${{ top: "50%", left: 0, width: 8, height: 8, opacity: 0 }} />
      <${Handle} type="source" position=${Position.Right} id="out"
        style=${{ top: "50%", right: 0, width: 8, height: 8, opacity: 0 }} />
    </div>`;
}

const nodeTypes = { agent: AgentNode, collapse: GroupNode, skill: SkillNode, finding: FindingNode };

/* ── 应用 ── */
function App({ initialSid }) {
  const [sid, setSid] = useState(initialSid || SESSIONS[0].id);
  const [expanded, setExpanded] = useState({});

  const toggle = useCallback((parent) => {
    setExpanded(prev => ({ ...prev, [parent]: !prev[parent] }));
  }, []);

  const { nodes, edges } = useMemo(() => {
    const g = buildGraph(sid, expanded);
    // 给 group 节点注入点击行为
    const ns = g.nodes.map(n => n.type === "group"
      ? { ...n, data: { ...n.data, toggle: () => toggle(n.data.parent) } }
      : n);
    return { nodes: ns, edges: g.edges };
  }, [sid, expanded, toggle]);

  const [rfNodes, setNodes, onNodesChange] = useNodesState(nodes);
  const [rfEdges, setEdges, onEdgesChange] = useEdgesState(edges);

  useEffect(() => { setNodes(nodes); setEdges(edges); }, [nodes, edges, setNodes, setEdges]);

  const onNodeClick = useCallback((evt, node) => {
    if (node.type === "collapse") toggle(node.data.parent);
  }, [toggle]);

  return html`
    <${ReactFlow}
      nodes=${rfNodes} edges=${rfEdges}
      onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange}
      nodeTypes=${nodeTypes} edgeTypes=${edgeTypes}
      onNodeClick=${onNodeClick}
      fitView fitViewOptions=${{ padding: 0.15 }}
      minZoom=${0.2} maxZoom=${2.5}
      nodesDraggable=${false} nodesConnectable=${false} elementsSelectable=${true}
      style=${{ width: "100%", height: "100%" }}
    >
      <${Background} gap=${22} color="#e6e9ef" />
      <${Controls} showInteractive=${false} />
      <${MiniMap} position="top-right" pannable zoomable nodeColor=${n => n.type === "collapse" ? "#c4cbd6" : "#9fb6ef"}
        style=${{ background: "#fafbfc" }} />
    <//>
  `;
}

const rootEl = document.getElementById("canvas");
const sessionEl = document.getElementById("sessions");
const appRoot = createRoot(rootEl);

function renderApp(sid) {
  appRoot.render(html`<${App} key=${sid} initialSid=${sid} />`);
}

// 简单会话切换：重新挂载 App
SESSIONS.forEach(s => {
  const b = document.createElement("button");
  b.className = "sess-btn";
  b.textContent = s.short;
  b.onclick = () => {
    document.querySelectorAll(".sess-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    renderApp(s.id);
  };
  sessionEl.appendChild(b);
});
function activeFromHash() {
  const m = location.hash.match(/#(\w+)/);
  const s = m && SESSIONS.find(x => x.id.startsWith(m[1]));
  return s ? s.id : SESSIONS[0].id;
}
const initial = activeFromHash();
document.querySelectorAll(".sess-btn").forEach(b => b.classList.toggle("active", b.textContent === SESSIONS.find(x => x.id === initial).short));
renderApp(initial);
window.addEventListener("hashchange", () => {
  const id = activeFromHash();
  document.querySelectorAll(".sess-btn").forEach(b => b.classList.toggle("active", b.textContent === SESSIONS.find(x => x.id === id).short));
  renderApp(id);
});
</script>

<script>
window.addEventListener("error", e => {
  const el = document.getElementById("canvas");
  if (el && !el.querySelector(".react-flow")) {
    el.innerHTML = '<div class="error">资源加载失败：需要能访问 esm.sh 与 unpkg.com（React / React Flow 走 CDN）。错误：' + (e.message || "") + '</div>';
  }
});
</script>
</body>
</html>
