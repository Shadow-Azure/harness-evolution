# 生产机 OS 包 provisioning：安装/验证归因 Skill 的 bubblewrap 前置。
# 独立手动入口，避免把 apt 权限交给 deploy，也避免每次发布携带 root。
# 前置：Secret ALIYUN_HOST / production Environment Secret PROVISION_SSH_KEY
#       （专用 root 私钥），可选 Variable PROVISION_SSH_USER（默认 root）；
#       Variable ALIYUN_SSH_PORT（默认 22）。
#       production environment 可配置 required reviewers 作为人工审批。
# 安全：只允许从 main 触发（脚本以 root 执行，必须来自已合并代码）；私钥只写
#       runner 上的 0600 文件；脚本经 stdin 执行，不在主机落临时文件；日志不含凭据。
name: Provision

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check 只验证；install 幂等安装并验证；dry-run 只打印计划"
        type: choice
        options:
          - check
          - install
          - dry-run
        default: check

permissions:
  contents: read

concurrency:
  group: provision-production
  cancel-in-progress: false

jobs:
  bubblewrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.ALIYUN_HOST }}
      SSH_PORT: ${{ vars.ALIYUN_SSH_PORT || '22' }}
      SSH_USER: ${{ vars.PROVISION_SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v6

      - name: 校验触发条件与凭据
        env:
          PROVISION_SSH_KEY: ${{ secrets.PROVISION_SSH_KEY }}
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            check | install | dry-run) ;;
            *) echo "::error::未知 mode: $MODE"; exit 1 ;;
          esac
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::未配置 ALIYUN_HOST"
            exit 1
          fi
          if [ -z "${PROVISION_SSH_KEY:-}" ]; then
            echo "::error::未配置 PROVISION_SSH_KEY；按 docs/deployment.md 的 Provision 入口配置专用 root 密钥"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Provision 只允许从 main 触发（脚本以 root 执行，必须来自已合并代码）：$GITHUB_REF"
            exit 1
          fi
          echo "mode=${MODE}；目标用户: ${SSH_USER}；等待 SSH 连接"

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.PROVISION_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/provision_key
          printf '%s\n' "$SSH_KEY" > ~/provision_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 执行 Provision
        id: provision
        run: |
          set -uo pipefail
          MODE="${{ inputs.mode }}"
          LOG="$RUNNER_TEMP/provision.log"
          SSH_CMD=(ssh -i "$HOME/provision_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST")
          set +e
          "${SSH_CMD[@]}" "bash -s -- --$MODE" < deploy/provision-bubblewrap.sh 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          STATE="$(sed -n 's/^provision\.bubblewrap state=\([^ ]*\) .*/\1/p' "$LOG" | tail -n 1)"
          CODE="$(sed -n 's/^provision\.bubblewrap .*error_code=\([^ ]*\)$/\1/p' "$LOG" | tail -n 1)"
          if [ -z "$STATE" ]; then
            STATE="unknown"
            CODE="PROVISION_NO_RESULT"
            if [ "$STATUS" -eq 0 ]; then STATUS=1; fi
          fi
          if [ "$STATUS" -eq 255 ]; then
            STATE="ssh-failed"
            CODE="PROVISION_SSH_FAILED"
          fi
          {
            echo "## Provision bubblewrap"
            echo
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 模式 | \`$MODE\` |"
            echo "| 状态 | \`$STATE\` |"
            echo "| 错误码 | \`$CODE\` |"
            echo
            case "$CODE" in
              NONE)
                echo "bubblewrap 已就绪，Deploy 的 \`attribution.preflight\` 应通过。"
                ;;
              ATTRIBUTION_BWRAP_MISSING)
                echo "主机缺少 bubblewrap。重跑本 workflow 并选择 \`install\`；安装后 Deploy 的 preflight 会通过。"
                ;;
              ATTRIBUTION_BWRAP_UNUSABLE)
                echo "bubblewrap 存在但以 \`harness\` 身份运行命名空间探针失败。Ubuntu 24.04 的 AppArmor userns 限制应由 \`install\` 模式安装的 \`/etc/apparmor.d/bwrap-userns-restrict\` 放行；其余检查 systemd 命名空间策略、seccomp 与 \`runuser\`；见 [部署文档](https://github.com/${{ github.repository }}/blob/main/docs/deployment.md#provision-入口)。"
                ;;
              PROVISION_SERVICE_USER_MISSING)
                echo "\`harness\` 服务账号不存在；先以 root 重跑 \`deploy/bootstrap-server.sh\`。"
                ;;
              PROVISION_APT_FAILED)
                echo "apt 安装失败；检查主机网络、apt 镜像与磁盘空间后重试。"
                ;;
              PROVISION_SSH_FAILED)
                echo "SSH 连接或认证失败；检查 ALIYUN_HOST / PROVISION_SSH_USER / PROVISION_SSH_KEY 与主机 authorized_keys 是否一致。"
                ;;
              PROVISION_NOT_ROOT)
                echo "SSH 用户不是 root；把 Variable \`PROVISION_SSH_USER\` 设为 \`root\`（或具备等价 root 权限的账号）。"
                ;;
              PROVISION_DRY_RUN)
                echo "dry-run 只打印计划，未验证主机；运行 \`check\` 或 \`install\` 获取真实状态。"
                ;;
              *)
                echo "未识别结果；查看上方 Provision 日志与 [部署文档](https://github.com/${{ github.repository }}/blob/main/docs/deployment.md#provision-入口)。"
                ;;
            esac
            echo
            echo "工作流入口：https://github.com/${{ github.repository }}/actions/workflows/provision.yml"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
