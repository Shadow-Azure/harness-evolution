name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态 lane：按环境分组并发执行；每次运行跑全部门禁，无路径过滤旁路。
  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web lint
        run: pnpm lint:web
      - name: Web typecheck
        run: pnpm typecheck:web
      - name: 设计 token 颜色源
        run: pnpm verify:web-style

  api-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: API lint
        run: pnpm lint:api
      - name: API typecheck
        run: pnpm typecheck:api
      - name: OpenAPI 契约防漂移
        run: pnpm contract:check

  unit-tests-web:
    # Web 与 API 分成两个并行 job：vitest 的 80% 阈值本来就按套件判定，
    # 拆 job 不需要跨 job 合并覆盖率，Web 也不再排在 API 关键路径前面。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile
          echo "SETUP_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Web 单元测试（vitest，覆盖率 ≥80%）
        run: |
          start=$(date +%s)
          pnpm test:web
          echo "WEB_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: CI 摘要
        if: always()
        run: |
          {
            echo "## unit-tests-web"
            echo
            echo "| 阶段 | 耗时 |"
            echo "|---|---:|"
            echo "| setup（checkout + pnpm install） | ${SETUP_SECONDS:-未完成}s |"
            echo "| web vitest | ${WEB_SECONDS:-未完成}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests-api:
    # API 套件用 pytest-xdist 并发（4 vCPU runner 上 8 worker，I/O 等待可重叠）；
    # pytest-cov 自动合并 worker 数据，
    # 90% 分支覆盖率仍由本 job 单独判定，不做跨 job coverage 聚合。
    # 本 job 只跑 Python 测试：pnpm 仅用于转发 package.json 脚本，不需要
    # node_modules，因此跳过 pnpm install，把 setup 压到 venv + pip。
    # 15 分钟预算在 2026-11-27 的套件规模上稳定超时（约 17 分钟），
    # 保留覆盖率的完整套件需要 20 分钟。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: 安装依赖
        run: |
          start=$(date +%s)
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
          echo "SETUP_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: API 单元测试（pytest -n 8，覆盖率 ≥90%）
        shell: bash
        run: |
          start=$(date +%s)
          pnpm test:api -- -n 8 --dist worksteal 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          echo "API_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: CI 摘要
        if: always()
        run: |
          {
            echo "## unit-tests-api"
            echo
            echo "| 阶段 | 耗时 |"
            echo "|---|---:|"
            echo "| setup（checkout + venv） | ${SETUP_SECONDS:-未完成}s |"
            echo "| api pytest（-n 8） | ${API_SECONDS:-未完成}s |"
            if [ -f "$RUNNER_TEMP/pytest.log" ]; then
              echo
              echo "<details><summary>最慢用例（--durations=25）</summary>"
              echo
              echo '```text'
              awk '/slowest [0-9]+ durations/,0' "$RUNNER_TEMP/pytest.log" | head -30
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  db-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: Fixtures seed 清单冒烟
        env:
          HE_DATA_DIR: ${{ runner.temp }}/harness-fixtures-seed
        run: |
          pnpm fixtures:check
          pnpm fixtures:seed
      - name: SQLite 数据库测试
        run: pnpm test:db
      - name: 本地数据卫生
        run: pnpm verify:local-data

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: 跨栈集成测试（Web → Vite proxy → FastAPI）
        timeout-minutes: 5
        run: pnpm test:integration
      - name: 真实浏览器 E2E（M1 shell + M3 Session 浏览器）
        # The suite's own budget is 15 minutes. Shared runners occasionally
        # stall a Chrome DevTools handshake; the harness now bounds each CDP
        # command, and one retry keeps a transient stall from failing the PR.
        timeout-minutes: 35
        run: |
          pnpm test:e2e || {
            echo "::warning::real-browser suite failed or stalled; retrying once"
            pnpm test:e2e
          }

  build-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 工作区类型检查
        run: pnpm typecheck
      - name: 构建
        run: pnpm build
      - name: 首屏 bundle 边界
        run: pnpm verify:bundle

  docs-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: 门禁自测试
        run: pnpm test:gates
      - name: 文档门禁（doc-sync）
        run: pnpm verify:docs
      - name: 开发流程门禁（PR diff）
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-flow.mjs --diff origin/${{ github.base_ref }}

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: harness-test
          MYSQL_DATABASE: harness_evolution_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pharness-test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: MySQL 双方言 repository 测试
        env:
          HE_DB_DIALECT: mysql
          HE_DB_URL: mysql+asyncmy://root:harness-test@127.0.0.1:3306/harness_evolution_test?charset=utf8mb4
          HE_REQUIRE_MYSQL: "1"
        run: pnpm test:db:mysql

  flow-online:
    # 在线 lane：流程树与 GitHub 双侧一致（只校验；写 GitHub 的唯一入口是 pnpm flow:sync）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 流程树与 GitHub 一致性
        env:
          GH_TOKEN: ${{ secrets.FLOW_TOKEN || secrets.GITHUB_TOKEN }}
          FLOW_PROJECT_CHECK: ${{ secrets.FLOW_TOKEN && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-flow-online.mjs

  deploy-contract:
    # 部署 provisioning 契约：干净 Ubuntu 容器里先验证缺包负例，再跑真实 provision
    # 脚本、服务账号命名空间探针与 attribution.preflight。与 Provision workflow
    # 共用 deploy/provision-bubblewrap.sh，避免 CI 与生产走两条安装路径。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:24.04
      # bwrap 需要创建 unprivileged user namespace；GitHub 的 Docker 默认
      # seccomp/AppArmor 会拒绝。这里只对一次性、无 secret 的 PR job 放开这两项，
      # 容器仍是非 privileged，且不挂载宿主目录或凭据。
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: 安装最小依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 python3-pip python3-venv
      - uses: actions/checkout@v6
      - name: Python 环境
        run: |
          python3 -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: 静态 provisioning 契约
        run: apps/api/.venv/bin/python -m pytest apps/api/tests/deploy/test_provisioning_contract.py -q
      - name: 干净主机 provisioning 契约
        run: bash apps/api/tests/deploy/verify_provisioning_contract.sh

  # 聚合 lane：分支保护唯一 required check。skipped（flow-online 在 push 事件）
  # 放行；failure / cancelled 一票否决。
  ci-ok:
    needs:
      [
        web-static,
        api-static,
        unit-tests-web,
        unit-tests-api,
        db-sqlite,
        e2e,
        build-lane,
        docs-flow,
        mysql,
        flow-online,
        deploy-contract,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总 lane 结果
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "存在失败或取消的 lane"; exit 1;;
            *) echo "全部 lane 通过或按条件跳过";;
          esac
