name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-docs:
    # 静态 lane：文档门禁内嵌在这里（doc-sync 全量），代码与文档没有旁路。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Web lint
        run: pnpm lint:web
      - name: Web typecheck
        run: pnpm typecheck:web
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: Fixtures seed 清单冒烟
        env:
          HE_DATA_DIR: ${{ runner.temp }}/harness-fixtures-seed
        run: |
          pnpm fixtures:check
          pnpm fixtures:seed
      - name: 门禁自测试
        run: pnpm test:gates
      - name: API lint
        run: pnpm lint:api
      - name: API typecheck
        run: pnpm typecheck:api
      - name: SQLite 数据库测试
        run: pnpm test:db
      - name: 单元测试（前后端，覆盖率 ≥80%）
        run: pnpm test
      - name: 跨栈集成测试（Web → Vite proxy → FastAPI）
        run: pnpm test:integration
      - name: 真实浏览器 E2E（M1 shell）
        run: pnpm test:e2e
      - name: OpenAPI 契约防漂移
        run: pnpm contract:check
      - name: 工作区类型检查
        run: pnpm typecheck
      - name: 设计 token 颜色源
        run: pnpm verify:web-style
      - name: 构建
        run: pnpm build
      - name: 首屏 bundle 边界
        run: pnpm verify:bundle
      - name: 文档门禁（doc-sync）
        run: pnpm verify:docs
      - name: 开发流程门禁（PR diff）
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-flow.mjs --diff origin/${{ github.base_ref }}

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: harness-test
          MYSQL_DATABASE: harness_evolution_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pharness-test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: MySQL 双方言 repository 测试
        env:
          HE_DB_DIALECT: mysql
          HE_DB_URL: mysql+asyncmy://root:harness-test@127.0.0.1:3306/harness_evolution_test?charset=utf8mb4
          HE_REQUIRE_MYSQL: "1"
        run: pnpm test:db:mysql

  flow-online:
    # 在线 lane：流程树与 GitHub 双侧一致（只校验；写 GitHub 的唯一入口是 pnpm flow:sync）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 流程树与 GitHub 一致性
        env:
          GH_TOKEN: ${{ secrets.FLOW_TOKEN || secrets.GITHUB_TOKEN }}
          FLOW_PROJECT_CHECK: ${{ secrets.FLOW_TOKEN && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-flow-online.mjs
