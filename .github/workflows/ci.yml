name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-docs:
    # 静态 lane：文档门禁内嵌在这里（doc-sync 全量），代码与文档没有旁路。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Python 环境
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: API lint
        run: pnpm lint:api
      - name: API typecheck
        run: pnpm typecheck:api
      - name: API tests
        run: pnpm test:api
      - name: 类型检查
        run: pnpm typecheck
      - name: 测试
        run: pnpm test
      - name: 构建
        run: pnpm build
      - name: 文档门禁（doc-sync）
        run: pnpm verify:docs
      - name: 开发流程门禁（PR diff）
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-flow.mjs --diff origin/${{ github.base_ref }}

  flow-online:
    # 在线 lane：流程树与 GitHub 双侧一致（只校验；写 GitHub 的唯一入口是 pnpm flow:sync）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 流程树与 GitHub 一致性
        env:
          GH_TOKEN: ${{ secrets.FLOW_TOKEN || secrets.GITHUB_TOKEN }}
          FLOW_PROJECT_CHECK: ${{ secrets.FLOW_TOKEN && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-flow-online.mjs
