# Harness Evolution — nginx 站点（HTTP;绑域名后把 server_name 改为域名并补 443）
# 安装（root）：cp deploy/nginx-harness.conf /etc/nginx/sites-available/harness
#              ln -sf /etc/nginx/sites-available/harness /etc/nginx/sites-enabled/
#              rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name _;

    root /opt/harness/current/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代本机 uvicorn；/api 前缀保持不变（后端路由自带 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE（/api/events）：关闭缓冲、拉长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
