#cloud-config
# 新机一次性 provisioning：在机器创建阶段安装归因 Skill 的 bubblewrap 前置。
# 用法：购买 ECS 时把本文件作为「用户数据 / cloud-init」传入（或等价 Ansible base role）。
# 边界：归因运行时前置以 deploy/attribution-runtime-prerequisites.list 为 source of truth；
#       本文件在创建阶段镜像该清单（当前只有 bubblewrap），避免首次 Deploy 被
#       attribution.preflight 拦下。deploy-contract 门禁会校验两边一致。
#       创建后仍需以 root 执行 bootstrap-server.sh 完成用户/MySQL/nginx/systemd；
#       Ubuntu 24.04 还需跑一次 Provision install 应用 AppArmor userns profile。
package_update: true
package_upgrade: false
packages:
  - bubblewrap
runcmd:
  - [bash, -lc, "command -v bwrap && bwrap --version"]
