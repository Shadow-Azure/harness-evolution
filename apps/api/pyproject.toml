[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-evolution-api"
version = "0.1.0"
description = "Harness Evolution FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyjwt>=2.10,<3",
  "python-ulid>=2.7,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "sse-starlette>=2.1,<4",
  "tzdata>=2024.1,<2026",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "mysql: integration tests requiring a MySQL service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "FAST", "RUF", "ASYNC", "S"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/errors.py" = ["S105"]
"tests/identity/**" = ["S105", "S106", "S107"]
"tests/test_cli_seed.py" = ["S106"]
"scripts/export_openapi.py" = ["S106"]
